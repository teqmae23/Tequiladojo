<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンラインメニュー — テキーラ道場</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#F1EFE8;--cream2:#E8E4D8;--cream3:#DDD8C8;
  --red:#b03020;--teal:#1a6e58;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
html,body{height:100%;}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;min-height:100vh;}

/* ヘッダー */
.hdr{background:var(--ink);padding:0 14px;display:flex;align-items:center;gap:10px;height:56px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.hdr-logo{font-family:var(--serif);font-size:16px;color:var(--gold-l);letter-spacing:.04em;white-space:nowrap;}
.hdr-sub{font-size:10px;color:var(--ink3);margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hdr-nav{display:flex;align-items:center;justify-content:center;padding:5px 10px;border:1px solid var(--cream3);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;white-space:nowrap;background:transparent;}
.hdr-nav:active{background:rgba(255,255,255,.08);}

/* ローディング/ログインゲート */
#gate{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;padding:24px;text-align:center;}

/* パンくず/戻る */
.crumb{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cream2);border-bottom:1px solid var(--cream3);flex-wrap:wrap;position:sticky;top:56px;z-index:40;}
.crumb-back{background:transparent;border:1px solid var(--cream3);border-radius:6px;color:var(--ink2);font-size:12px;padding:5px 10px;cursor:pointer;}
.crumb-title{font-family:var(--serif);font-size:15px;color:var(--ink);}
.crumb-path{font-size:11px;color:var(--ink3);}

#app{flex:1;display:none;flex-direction:column;}
.view{display:none;padding:16px 14px 40px;max-width:960px;margin:0 auto;width:100%;}
.view.on{display:block;}

/* メニュートップ：大分類カード */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cat-card{background:#fff;border:1px solid var(--cream3);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 4px rgba(20,15,8,.05);}
.cat-card:active{transform:scale(.98);}
.cat-card .ci{font-size:34px;line-height:1;margin-bottom:10px;}
.cat-card .cn{font-family:var(--serif);font-size:17px;color:var(--ink);letter-spacing:.03em;}
.cat-card .cd{font-size:11px;color:var(--ink3);margin-top:4px;}
.cat-card.soon{opacity:.55;}
.badge-soon{display:inline-block;font-size:9px;background:var(--cream3);color:var(--ink3);border-radius:4px;padding:1px 6px;margin-top:6px;}
@media(min-width:560px){.cat-grid{grid-template-columns:repeat(3,1fr);}}

/* テキーラ サブナビ */
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;}
.subnav button{flex-shrink:0;padding:7px 12px;border:1px solid var(--cream3);border-radius:20px;background:#fff;color:var(--ink2);font-size:12px;cursor:pointer;white-space:nowrap;}
.subnav button.on{background:var(--gold-d);color:var(--cream);border-color:var(--gold-d);}

/* ツールバー（検索・フィルタ・並び替え） */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.toolbar input[type=text],.toolbar select{padding:7px 10px;border:1px solid var(--cream3);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-family:var(--sans);}
.toolbar .tsearch{flex:1;min-width:150px;}
.tcount{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 8px;}

/* ボトル一覧（1ボトル1行） */
.blist{display:flex;flex-direction:column;background:#fff;border:1px solid var(--cream3);border-radius:12px;overflow:hidden;}
.brow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--cream2);}
.brow:last-child{border-bottom:none;}
.binfo{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clschip{display:inline-block;font-size:10px;font-weight:700;min-width:16px;text-align:center;padding:1px 5px;border-radius:4px;background:#fff;color:var(--gold-d);border:1px solid rgba(122,86,16,.35);margin-right:6px;vertical-align:middle;}
.brow .bmeta{background:transparent;}
.bn{font-size:14px;font-weight:600;color:var(--ink);}
.blot{font-weight:600;color:var(--ink);}
.bmeta{font-size:11px;color:var(--ink3);margin-left:6px;}
.babv{flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap;}
.bp{flex-shrink:0;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;min-width:52px;text-align:right;}
.bp.none{font-size:11px;color:var(--ink3);font-weight:400;}
.price-note{font-size:11px;color:var(--ink3);text-align:right;}
.empty{text-align:center;color:var(--ink3);padding:40px 0;font-size:13px;}
.soon-box{text-align:center;color:var(--ink3);padding:48px 16px;font-size:14px;}
.soon-box .si{font-size:40px;margin-bottom:10px;}

/* 蒸留所一覧 */
.dlist{display:flex;flex-direction:column;background:#fff;border:1px solid var(--cream3);border-radius:12px;overflow:hidden;}
.drow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--cream2);cursor:pointer;}
.drow:last-child{border-bottom:none;}
.drow:active{background:var(--cream2);}
.dinfo{flex:1;min-width:0;}
.dname{display:block;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dnom{display:block;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:1px;}
.dcount{flex-shrink:0;font-size:12px;color:var(--gold-d);font-weight:600;white-space:nowrap;}
.dchev{flex-shrink:0;font-size:18px;color:var(--ink3);}
.drank{flex-shrink:0;min-width:34px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold-d);text-align:center;}
.dstat{flex-shrink:0;text-align:center;min-width:36px;}
.dstat-v{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);line-height:1.1;}
.dstat-l{font-size:9px;color:var(--ink3);}
.dir-sel{padding-left:8px!important;padding-right:8px!important;}
/* 複合ソートキー（一覧タブ） */
.sortkeys{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk-lbl{font-size:11px;color:var(--ink3);font-weight:600}
.sk-pair{display:inline-flex;align-items:center;gap:2px}
.sk-key{padding:7px 6px!important;font-size:12px!important;min-width:62px}
/* 蒸留所一覧: 項目名ヘッダ＋1行グリッド（Rank/名前/NOM/種類/スコア/評価数） */
.dgrid-head,.dgrid-row{display:grid;grid-template-columns:40px 1fr 52px 40px 46px 46px;align-items:center;gap:6px;}
.dgrid-head{padding:6px 10px;margin:0 2px 4px;font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.02em;text-align:center;}
.dgrid-head span:nth-child(2){text-align:left;}
.dgrid-row{padding:11px 10px;border-bottom:1px solid var(--cream2);cursor:pointer;background:#fff;}
.dlist .dgrid-row:last-child{border-bottom:none;}
.dgrid-row:active{background:var(--cream2);}
.dg-rank{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold-d);text-align:center;}
.dg-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dg-nom{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:center;}
.dg-num{font-family:var(--mono);font-size:13px;color:var(--ink);text-align:center;}
.dg-score{font-weight:700;color:var(--gold-d);}
/* ブランド ツリー */
.brand-tree{background:#fff;border:1px solid var(--cream3);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.bt-sum{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;list-style:none;}
.bt-sum::-webkit-details-marker{display:none;}
.bt-sum::before{content:'■';color:var(--ink);font-size:12px;flex-shrink:0;transition:transform .15s;}
details[open]>.bt-sum::before{transform:rotate(90deg);}
.bt-name{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bt-dist{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.bt-count{flex-shrink:0;font-size:12px;color:var(--gold-d);font-weight:600;}
.bt-kids{border-top:1px solid var(--cream2);border-radius:0;border-left:none;border-right:none;border-bottom:none;}
.bt-kids.blist{margin:0;}
/* 蒸留所詳細（ブランド別） */
.dist-detail-head{margin-bottom:14px;}
.dist-detail-name{font-family:var(--serif);font-size:20px;color:var(--ink);}
.dist-detail-nom{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:2px;}
.brand-group{margin-bottom:16px;}
.brand-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--gold-d);letter-spacing:.02em;padding:4px 2px 6px;border-bottom:2px solid var(--cream3);margin-bottom:6px;cursor:pointer;}
.brand-head-more{font-size:11px;color:var(--ink3);font-weight:400;}
/* ブランド詳細 */
.brand-detail-head{background:#fff;border:1px solid var(--cream3);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.brand-detail-es{font-family:var(--serif);font-size:20px;color:var(--ink);}
.brand-detail-ja{font-size:13px;color:var(--ink3);margin-top:2px;}
.brand-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.bbadge{font-size:11px;background:var(--cream2);color:var(--ink2);border-radius:6px;padding:3px 9px;}
.brand-dist{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:13px;color:var(--gold-d);cursor:pointer;}
.brand-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.ext-link{font-size:12px;color:var(--gold-d);text-decoration:none;border:1px solid var(--cream3);border-radius:8px;padding:5px 10px;}
.ext-link:active{background:var(--cream2);}
/* 地図メニュー */
.map-note{font-size:11px;color:var(--ink3);margin:0 2px 8px;}
#menu-map{height:72vh;min-height:360px;border:1px solid var(--cream3);border-radius:12px;overflow:hidden;}
.map-pin{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.map-pin-vis{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #e8d000;box-shadow:0 1px 5px rgba(0,0,0,.5);}
.map-pin-dim{width:12px;height:12px;border-radius:50%;background:#c2c2c2;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.85;}
.map-ctrls{display:flex;align-items:center;gap:8px;margin:0 2px 8px;flex-wrap:wrap;}
.map-ctrls label{font-size:11px;color:var(--ink2);white-space:nowrap;}
.map-ctrls select{font-size:12px;padding:4px 8px;border:1px solid var(--cream3);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;}
.map-pop-name{font-weight:700;font-size:13px;color:var(--ink);}
.map-pop-nom{font-size:11px;color:var(--ink3);font-family:var(--mono);margin:2px 0 6px;}
.map-pop-btn{display:inline-block;background:var(--gold-d);color:var(--cream);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;text-align:center;}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-logo">テキーラ道場</div>
    <div class="hdr-sub" data-i18n="menu_hdr_sub">オンラインメニュー</div>
  </div>
  <div class="hdr-right">
    <span id="lang-switch" style="display:inline-flex;align-items:center;color:var(--gold-l)"></span>
    <a class="hdr-nav" href="/member.html" data-i18n="menu_nav_mypage">マイページ</a>
  </div>
</div>

<div id="gate">読み込み中…</div>

<div id="app">
  <!-- パンくず -->
  <div class="crumb" id="crumb" style="display:none;">
    <button class="crumb-back" id="crumb-back" data-i18n="menu_back">← 戻る</button>
    <div>
      <div class="crumb-title" id="crumb-title"></div>
      <div class="crumb-path" id="crumb-path"></div>
    </div>
  </div>

  <!-- メニュートップ -->
  <div class="view on" id="view-top">
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- テキーラ -->
  <div class="view" id="view-teq">
    <div class="subnav" id="teq-subnav">
      <button data-mode="list" class="on" data-i18n="menu_tab_list">一覧</button>
      <button data-mode="distillery" data-i18n="menu_tab_dist">蒸留所</button>
      <button data-mode="brand" data-i18n="menu_tab_brand">ブランド</button>
      <button data-mode="map" data-i18n="menu_tab_map">地図</button>
    </div>
    <!-- 一覧モード -->
    <div id="teq-list-wrap">
      <div class="toolbar">
        <input type="text" class="tsearch" id="q" placeholder="検索…" data-i18n-ph="menu_ph_search" style="flex:0 1 110px;min-width:80px">
        <select id="f-class"><option value="" data-i18n="menu_allclass">全クラス</option></select>
        <div class="sortkeys" id="sortkeys">
          <span class="sk-lbl" data-i18n="menu_sort">並び</span>
        </div>
      </div>
      <div class="list-head">
        <span class="tcount" id="teq-count"></span>
        <span class="price-note" data-i18n="menu_price_note">※ 価格はすべて10ml単位です</span>
      </div>
      <div class="blist" id="teq-list"><div class="empty">読み込み中…</div></div>
    </div>
    <!-- 蒸留所モード -->
    <div id="teq-dist-wrap" style="display:none;">
      <div id="dist-list-view">
        <div class="toolbar">
          <input type="text" class="tsearch" id="dq" placeholder="蒸留所名・NOMで検索…" data-i18n-ph="menu_ph_dsearch">
          <select id="d-sort">
            <option value="rank" selected data-i18n="menu_sk_rank">ランク</option>
            <option value="nom">NOM</option>
            <option value="name" data-i18n="menu_sk_name">名前</option>
            <option value="score" data-i18n="menu_sk_score">スコア</option>
            <option value="ratings" data-i18n="menu_sk_ratings">評価数</option>
          </select>
          <select id="d-dir" class="dir-sel">
            <option value="asc">↑</option>
            <option value="desc">↓</option>
          </select>
        </div>
        <div class="list-head"><span class="tcount" id="dist-count"></span></div>
        <div class="dgrid-head">
          <span>Rank</span><span data-i18n="menu_h_dname">蒸留所名</span><span>NOM</span><span data-i18n="menu_h_type">種類</span><span data-i18n="menu_h_score">スコア</span><span data-i18n="menu_h_ratings">評価数</span>
        </div>
        <div class="dlist" id="dist-list"></div>
      </div>
      <div id="dist-detail-view" style="display:none;">
        <button class="crumb-back" id="dist-back" style="margin-bottom:12px;" data-i18n="menu_back_distlist">← 蒸留所一覧へ</button>
        <div id="dist-detail"></div>
      </div>
    </div>

    <!-- ブランドモード -->
    <div id="teq-brand-wrap" style="display:none;">
      <div id="brand-list-view">
        <div class="toolbar">
          <input type="text" class="tsearch" id="bq" placeholder="ブランド名・蒸留所・NOMで検索…" data-i18n-ph="menu_ph_bsearch">
        </div>
        <div class="list-head"><span class="tcount" id="brand-count"></span></div>
        <div class="dlist" id="brand-list"></div>
      </div>
      <div id="brand-detail-view" style="display:none;">
        <button class="crumb-back" id="brand-back" style="margin-bottom:12px;" data-i18n="menu_back_brandlist">← ブランド一覧へ</button>
        <div id="brand-detail"></div>
      </div>
    </div>

    <!-- 地図モード -->
    <div id="teq-map-wrap" style="display:none;">
      <div class="map-note" data-i18n="menu_map_note">📍 ボトルのある蒸留所のみ表示。ピンをタップすると蒸留所メニューを開きます。</div>
      <div class="map-ctrls">
        <label data-i18n="menu_boundary">境界</label>
        <select id="menu-dot" onchange="onMenuDotChange(this.value)">
          <option value="none" selected data-i18n="menu_b_none">なし</option>
          <option value="state" data-i18n="menu_b_state">州境界</option>
          <option value="municipio" data-i18n="menu_b_muni">自治区境界</option>
          <option value="all" data-i18n="menu_b_all">全境界</option>
        </select>
        <select id="menu-visited" onchange="onMenuVisitedChange(this.value)">
          <option value="all" selected data-i18n="menu_v_all">全件</option>
          <option value="visited" data-i18n="menu_v_visited">既飲</option>
        </select>
        <span id="menu-map-loading" style="font-size:11px;color:var(--gold-d);display:none;">読み込み中…</span>
      </div>
      <div id="menu-map"></div>
    </div>

    <!-- 準備中モード -->
    <div id="teq-soon" style="display:none;">
      <div class="soon-box"><div class="si">🚧</div><div id="teq-soon-label" data-i18n="menu_soon">準備中</div><div style="font-size:12px;margin-top:6px;" data-i18n="menu_soon_mode">この表示モードは近日公開予定です。</div></div>
    </div>
  </div>

  <!-- 他カテゴリ（準備中） -->
  <div class="view" id="view-soon">
    <div class="soon-box"><div class="si">🚧</div><div id="soon-label" data-i18n="menu_soon">準備中</div><div style="font-size:12px;margin-top:6px;" data-i18n="menu_soon_menu">このメニューは近日公開予定です。</div></div>
  </div>
</div>

<!-- ─── オンライン注文 ─── -->
<div id="order-bar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:900;background:#18110a;color:#fff;padding:10px 14px;align-items:center;gap:10px;box-shadow:0 -2px 14px rgba(0,0,0,.25)">
  <button onclick="openDrinksModal()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer"data-i18n="menu_btn_other">🍶 その他</button>
  <div style="flex:1"></div>
  <button onclick="openCartModal()" id="order-cart-btn" style="background:#7a5610;border:none;color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer">🛒 <span id="order-cart-count">0</span>件 ・ <span id="order-cart-total">¥0</span></button>
</div>

<!-- ml/数量ピッカー -->
<div id="qty-modal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:18px">
  <div style="background:#fff;border-radius:14px;max-width:340px;width:100%;padding:18px 18px 16px">
    <div id="qty-name" style="font-size:15px;font-weight:700;color:#18110a;margin-bottom:4px"></div>
    <div id="qty-price" style="font-size:12px;color:#9a8470;margin-bottom:12px"></div>
    <div id="qty-presets" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <span style="font-size:13px;color:#4a3820" id="qty-unit-label">ml</span>
      <input type="number" id="qty-input" min="1" style="flex:1;padding:9px 11px;border:1px solid #d8ccb8;border-radius:8px;font-size:15px;text-align:right;font-family:monospace">
      <span id="qty-subtotal" style="font-size:14px;font-weight:700;color:#7a5610;min-width:66px;text-align:right">¥0</span>
    </div>

/* ── 名称解決 ──
   bottleData のドキュメントIDは連番(bottleDataId)で、12桁のbottleIdは別フィールド。
   NOM(蒸留所4桁)・brandId(7桁)・classId(2桁)は bottleId から導出できる:
   bottleId = 蒸留所ID4 + ブランド連番3 + classId2 + 連番3 (= brandId7 + classId2 + seq3)。 */
function bidOf(b){ return String(b.bottleId||''); }
function brandIdOf(b){ if(b.brandId) return String(b.brandId); var s=bidOf(b); return s.length>=7?s.slice(0,7):''; }
// ブランド名は brands コレクション（brandEs/brandJa）で解決。IDは出さない。
function brandOf(b){
  var m=brandMap[brandIdOf(b)];
  return m?(m.brandJa||m.brandEs||''):'';
}
// クラス: classId は2桁（カテゴリ+クラス）。2桁目でB/J/R/A/X判定（home_order準拠）
var CLS_MAP={B:'1',J:'2',R:'3',A:'4',X:'5'};
var CLS_ORDER=['B','J','R','A','X'];
var CLS_NAME={B:'Blanco',J:'Joven/Gold',R:'Reposado',A:'Añejo',X:'Extra Añejo'};
var CLS_COLOR={B:'#fcfbf7',J:'#fbf1d5',R:'#f5e6c0',A:'#eed7a8',X:'#e3c48f'};
function clsDigit(b){
  if(b.classId!=null&&b.classId!==''){ var c=String(b.classId); return c.length>=2?c.charAt(1):c; }
  var s=bidOf(b); return s.length>=9?s.charAt(8):'';
}
function clsLetterOf(b){
  var d=clsDigit(b);
  return CLS_ORDER.find(function(k){return CLS_MAP[k]===d;})||'';
}
// NOM(蒸留所4桁): 明示フィールドが無ければ bottleId の先頭4桁を使う
function nomOf(b){
  if(b.nom!=null&&b.nom!=='') return String(b.nom);
  var s=bidOf(b); return s.length>=4?s.slice(0,4):'';
}
function nameOf(b){ return b.bottleEs||b.bottleEn||b.bottleJa||b.name||'(名称未設定)'; }
// LOT番号（意味のある値のみ）
function lotOf(b){ var l=b.lotNo!=null?String(b.lotNo):(b.lot!=null?String(b.lot):''); l=l.trim(); return (l&&l!=='N/A'&&l!=='-'&&l!=='0')?l:''; }
// 追記（suffix）: ボトル名末尾に括弧書きで表示する注記
function sfxOf(b){ return (b.suffix!=null?String(b.suffix):'').trim(); }
// テキーラ表示名 = NameEs(+追記)。日本語名は使わない。
function esName(b){ var es=b.bottleEs||b.bottleEn||b.name||'(no name)'; var s=sfxOf(b); return es+(s?(' ('+s+')'):''); }
// 蒸留所名Es / ブランド名Es（Es優先）
function distEsOf(nom){ var m=distMap[nom]; return m?(m.nomEs||m.nomJa||m.name||''):''; }
function brandEsOf(bid){ var m=brandMap[bid]; return m?(m.brandEs||m.brandJa||''):''; }
// 10ml単価: bottleData の price が 10ml 単価（フォールバック unitPrice / price10）
function price10(b){ return parseFloat(b.price!=null?b.price:(b.unitPrice!=null?b.unitPrice:b.price10))||0; }

/* ── テキーラ一覧 ── */
function buildClassFilter(){
  // クラスは常に B/J/R/A/X の5種を固定表示（該当ボトルの有無に依存しない）
  var sel=document.getElementById('f-class');

  }).join('');
}
// 複合ソート用: 3つのソートキー（各↑↓）を動的生成
var SORT_OPTS=[['nom','NOM'],['name','名前'],['class','クラス'],['price','価格'],['abv','度数'],['none','—']];
function buildSortKeys(){
  var box=document.getElementById('sortkeys'); if(!box) return;
  var defs=[['nom','asc'],['none','asc']];
  var html='<span class="sk-lbl" data-i18n="menu_sort">並び</span>';
  for(var i=1;i<=2;i++){
    var d=defs[i-1];
    html+='<span class="sk-pair">'
      +'<select id="f-sort'+i+'" class="sk-key">'+SORT_OPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===d[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'
      +'<select id="f-dir'+i+'" class="dir-sel"><option value="asc"'+(d[1]==='asc'?' selected':'')+'>↑</option><option value="desc">↓</option></select>'
      +'</span>';
  }
  box.innerHTML=html;
  ['f-sort1','f-dir1','f-sort2','f-dir2'].forEach(function(id){ document.getElementById(id).addEventListener('change',renderTeqList); });
}
['q','f-class'].forEach(function(id){
  document.getElementById(id).addEventListener('input',renderTeqList);
  document.getElementById(id).addEventListener('change',renderTeqList);
});
function cmpSortKey(a,b,k){
  if(k==='nom') return String(nomOf(a)).localeCompare(String(nomOf(b)),undefined,{numeric:true});
  if(k==='price') return price10(a)-price10(b);
  if(k==='abv') return (parseFloat(a.abv)||0)-(parseFloat(b.abv)||0);
  if(k==='class'){ var ra=CLS_ORDER.indexOf(clsLetterOf(a)); if(ra<0)ra=99; var rb=CLS_ORDER.indexOf(clsLetterOf(b)); if(rb<0)rb=99; return ra-rb; }
  if(k==='name') return esName(a).localeCompare(esName(b),'en');
  return 0;
}
function renderTeqList(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var fc=document.getElementById('f-class').value;
  // 複合ソートキー（上から優先。noneは無視）
  var keys=[];
  for(var i=1;i<=2;i++){
    var sk=document.getElementById('f-sort'+i); if(!sk) continue;
    var k=sk.value; if(!k||k==='none') continue;
    keys.push({k:k, d:document.getElementById('f-dir'+i).value==='desc'?-1:1});
  }
  if(!keys.length) keys.push({k:'nom',d:1});
  var list=bottles.filter(function(b){
    if(fc && clsLetterOf(b)!==fc) return false;
    if(q){
      if(/^\d+$/.test(q)){
        if(nomOf(b).indexOf(q)<0) return false;
      } else {
        var hay=(esName(b)+' '+(b.bottleJa||'')+' '+brandOf(b)).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
    }
    return true;
  });
  list.sort(function(a,b){
    for(var i=0;i<keys.length;i++){ var c=cmpSortKey(a,b,keys[i].k)*keys[i].d; if(c) return c; }
    return 0;
  });
  document.getElementById('teq-count').textContent=list.length+' 種';
  if(!list.length){ document.getElementById('teq-list').innerHTML='<div class="empty">該当するボトルがありません</div>'; return; }
  document.getElementById('teq-list').innerHTML=list.map(function(b){ return bottleRowHtml(b,true); }).join('');
}

// ボトル1行のHTML。showMeta=true でブランド/NOMを表示（蒸留所別ではブランドが見出しなので抑制）
function bottleRowHtml(b, showMeta){
  var p=price10(b), letter=clsLetterOf(b), nom=nomOf(b), abv=b.abv;
  var bg=CLS_COLOR[letter]||'#fff';
  var meta=showMeta?[brandEsOf(brandIdOf(b)), nom?('NOM'+nom):''].filter(Boolean).join(' / '):'';
  var addBtn=(_orderable&&p>0)?'<button class="order-add" onclick="event.stopPropagation();openQtyModal(\'tequila\',\''+esc(b.id)+'\')" style="flex-shrink:0;margin-left:6px;background:#7a5610;color:#fff;border:none;border-radius:7px;width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer">＋</button>':'';
  return '<div class="brow" style="background:'+bg+'">'
    +'<div class="binfo">'
      +(letter?'<span class="clschip" title="'+esc(CLS_NAME[letter])+'">'+letter+'</span>':'')
      +'<span class="bn">'+esc(b.bottleEs||b.bottleEn||b.name||'(no name)')+(sfxOf(b)?' <span class="blot">('+esc(sfxOf(b))+')</span>':'')+'</span>'
      +(meta?'<span class="bmeta">'+esc(meta)+'</span>':'')
    +'</div>'
    +(abv?'<span class="babv">'+esc(abv)+'%</span>':'')
    +(p>0?'<div class="bp">'+yen(p)+'</div>':'<div class="bp none">—</div>')
    +addBtn
  +'</div>';
}

/* ── 蒸留所メニュー ── */
function distNameOf(nom){ var m=distMap[nom]; return m?(m.nomJa||m.nomEs||m.name||''):''; }

function renderDistList(){
  var groups={};
  bottles.forEach(function(b){ var n=nomOf(b); if(!n) return; (groups[n]=groups[n]||[]).push(b); });
  var noms=Object.keys(groups);
  var dq=(document.getElementById('dq').value||'').toLowerCase().trim();
  if(dq){
    noms=noms.filter(function(n){
      if(/^\d+$/.test(dq)) return n.indexOf(dq)>=0;
      return (distEsOf(n)+' '+distNameOf(n)).toLowerCase().indexOf(dq)>=0;
    });
  }
  // 並び替え（既定: NOM昇順）。スコア/評価数は未取得(null)を末尾へ
  var key=document.getElementById('d-sort').value;
  var dir=document.getElementById('d-dir').value==='desc'?-1:1;
  function nn(v){ return v==null?(dir===1?Infinity:-Infinity):v; }
  noms.sort(function(a,b){
    var c;
    if(key==='rank') c=nn(ptdRank(a))-nn(ptdRank(b));
    else if(key==='name') c=distEsOf(a).localeCompare(distEsOf(b),'en');
    else if(key==='score') c=nn(ptdScore(a))-nn(ptdScore(b));
    else if(key==='ratings') c=nn(ptdRatings(a))-nn(ptdRatings(b));
    else c=a.localeCompare(b,undefined,{numeric:true}); // NOM
    if(c===0) c=a.localeCompare(b,undefined,{numeric:true});
    return c*dir;
  });
  document.getElementById('dist-count').textContent=noms.length+' 蒸留所';
  if(!noms.length){ document.getElementById('dist-list').innerHTML='<div class="empty">該当する蒸留所がありません</div>'; return; }
  document.getElementById('dist-list').innerHTML=noms.map(function(n){
    var nm=distEsOf(n)||'(名称未登録)';
    var rk=ptdRank(n), sc=ptdScore(n), rt=ptdRatings(n);
    return '<div class="dgrid-row" onclick="openDistillery(\''+n+'\')">'
      +'<span class="dg-rank">'+(rk!=null?'#'+rk:'—')+'</span>'
      +'<span class="dg-name">'+esc(nm)+'</span>'
      +'<span class="dg-nom">'+esc(n)+'</span>'
      +'<span class="dg-num">'+groups[n].length+'</span>'
      +'<span class="dg-num dg-score">'+(sc!=null?sc:'—')+'</span>'
      +'<span class="dg-num">'+(rt!=null?rt:'—')+'</span>'
    +'</div>';
  }).join('');
}

var _distFrom='list'; // 蒸留所詳細をどこから開いたか（'list' or 'map'）
function openDistillery(nom, from){
  _distFrom=from||'list';
  var backEl=document.getElementById('dist-back');
  if(backEl) backEl.textContent=(_distFrom==='map')?'← 地図へ':'← 蒸留所一覧へ';
  document.getElementById('dist-list-view').style.display='none';
  document.getElementById('dist-detail-view').style.display='';
  var mine=bottles.filter(function(b){ return nomOf(b)===nom; });
  // ブランドでグループ化
  var bg={};
  mine.forEach(function(b){ var bid=brandIdOf(b); (bg[bid]=bg[bid]||[]).push(b); });
  var brandIds=Object.keys(bg).sort();
  var nm=distEsOf(nom)||'(名称未登録)';

/* ── DOT原産地呼称境界の表示/非表示（マイマップと同一データ源: dotMunicipios） ── */
var DOT_STATES=[
  {state:'Jalisco',   iso:'MX-JAL',stateLevel:true,color:'#2e7d32'},
  {state:'Guanajuato',iso:'MX-GUA',color:'#7b1fa2'},
  {state:'Michoacán', iso:'MX-MIC',color:'#e65100'},
  {state:'Nayarit',   iso:'MX-NAY',color:'#e69900',muniColor:'#3d2800'},
  {state:'Tamaulipas',iso:'MX-TAM',color:'#1565c0'}
];
var _dotColorByIso={}, _muniColorByIso={};
DOT_STATES.forEach(function(s){ _dotColorByIso[s.iso]=s.color; if(s.muniColor) _muniColorByIso[s.iso]=s.muniColor; });
var _menuDotFillOpacity=0.15;
var _menuDotLayer=null, _menuDotLoading=false, _dotOutlineDocs=null, _dotMuniDocs=null;

function _dotMuniIsoSet(){
  var set=new Set();
  (_dotMuniDocs||[]).forEach(function(doc){
    var m=doc.id.match(/^([^_]+-[^_]+)_municipio_/);
    if(m){ var sq=DOT_STATES.find(function(s){return s.stateLevel&&s.iso===m[1];}); if(sq) set.add(m[1]); }
  });
  return set;
}
function _buildDotFeatures(docs, muniIsoSet){
  var features=[];
  (docs||[]).forEach(function(doc){
    if(doc.id==='_config') return;
    var d=doc.data(); if(!d.geomJson) return;
    try{
      var geom=JSON.parse(d.geomJson);
      var et=d.entryType;
      if((et==='dotState'||et==='stateBoundary'||et==='dotMerged')&&geom.type==='Polygon'&&geom.coordinates.length>1){
        geom={type:'Polygon',coordinates:[geom.coordinates[0]]};
      }
      var nm=et==='municipio'?d.name:((et==='dotState'||et==='dotMerged')?(d.name||d.state):null);
      var mOrig=doc.id.match(/_municipio_(.+)$/);
      var mapKey=mOrig?(mOrig[1].replace(/_/g,' ')):((et==='dotState'||et==='dotMerged')?d.state:null);
      var docIso=d.iso||((doc.id.match(/^([^_]+-[^_]+)_/)||['',''])[1]);
      var isOutline=et==='stateBoundary'||(et==='dotState'&&muniIsoSet.has(d.iso));
      var isDotFill=(et==='dotMerged')||(et==='dotState'&&!muniIsoSet.has(d.iso));
      features.push({type:'Feature',geometry:geom,properties:{
        _dotColor:d.color,_isStateOutline:isOutline,_isDotState:isDotFill,
        _displayName:nm,_mapKey:mapKey,_iso:docIso
      }});
    }catch(e){}
  });
  return features;
}
function _menuDotStyle(f){
  var p=f.properties||{};
  var iso=p._iso;
  var c=(iso&&_dotColorByIso[iso])||p._dotColor||'#2e7d32';
  var fo=_menuDotFillOpacity;
  if(p._isStateOutline) return {color:c,weight:3,fillOpacity:0,opacity:0.9};
  if(p._isDotState) return {color:c,weight:3,fillColor:c,fillOpacity:fo,opacity:0.9};
  var mc=(iso&&_muniColorByIso[iso])||c;
  return {color:mc,weight:0.6,fillColor:c,fillOpacity:fo,opacity:0.85};
}
async function _ensureDotOutlines(){
  if(_dotOutlineDocs) return;
  var snap=await db.collection('dotMunicipios').where('entryType','in',['stateBoundary','dotState','dotMerged']).get();
  _dotOutlineDocs=snap.docs;
}
async function _ensureDotMunis(){
  if(_dotMuniDocs) return;
  var snap=await db.collection('dotMunicipios').where('entryType','==','municipio').get();
  _dotMuniDocs=snap.docs;
}
function _menuBringJaliscoToFront(){
  if(!_menuDotLayer) return;
  _menuDotLayer.eachLayer(function(l){
    var p=l.feature&&l.feature.properties;
    if(p&&p._iso==='MX-JAL'&&(p._isStateOutline||p._isDotState)) l.bringToFront();
  });
}
async function onMenuDotChange(mode){
  var sel=document.getElementById('menu-dot');
  if(_menuDotLayer){ _menuMap.removeLayer(_menuDotLayer); _menuDotLayer=null; }
  if(mode==='none') return;
  if(_menuDotLoading) return;
  _menuDotLoading=true; if(sel) sel.disabled=true;
  var ld=document.getElementById('menu-map-loading'); if(ld) ld.style.display='inline';
  var feats;
  try{
    var needOutlines=(mode==='state'||mode==='all');
    var needMunis=(mode==='municipio'||mode==='all');
    if(needOutlines) await _ensureDotOutlines();
    if(needMunis) await _ensureDotMunis();
    var muniIsoSet=_dotMuniIsoSet();
    if(mode==='state'){
      feats=_buildDotFeatures(_dotOutlineDocs, muniIsoSet);
    } else if(mode==='municipio'){
      feats=_buildDotFeatures(_dotMuniDocs, muniIsoSet);
    } else {
      var outlineNoMerged=(_dotOutlineDocs||[]).filter(function(doc){ return doc.data().entryType!=='dotMerged'; });
      feats=_buildDotFeatures(outlineNoMerged, muniIsoSet).concat(_buildDotFeatures(_dotMuniDocs, muniIsoSet));
    }
  }catch(e){
    alert('境界の読み込みに失敗しました:\n'+e.message);
    if(sel){ sel.value='none'; sel.disabled=false; } _menuDotLoading=false;
    if(ld) ld.style.display='none'; return;
  }finally{
    _menuDotLoading=false; if(sel) sel.disabled=false; if(ld) ld.style.display='none';
  }
  _menuDotLayer=L.geoJSON({type:'FeatureCollection',features:feats},{
    filter:function(f){
      var t=f.geometry&&f.geometry.type;
      if(!t||t==='Point'||t==='MultiPoint') return false;
      var p=f.properties||{};
      var isState=p._isStateOutline||p._isDotState;
      if(mode==='state') return !!isState;
      if(mode==='municipio') return !isState;
      return true;
    },
    style:_menuDotStyle,
    onEachFeature:function(f,layer){
      var nm=f.properties&&f.properties._displayName;
      if(nm) layer.bindPopup('<div style="padding:4px 6px;font-size:13px;font-weight:500;">'+esc(nm)+'</div>',{maxWidth:200});
    }
  }).addTo(_menuMap);
  _menuBringJaliscoToFront();
}

function _prodName(pt,p,id){

  if(pt==='other') return p.bottleEn||p.bottleName||p.name||p.bottleJa||id;

}

var _ML_PRESETS=[10,20,30,45,60];
function openQtyModal(pt,id){
  var p = pt==='tequila'?_teqById(id) : pt==='other'?_otherById(id) : _miscById(id);
  if(!p){ menuToast('商品が見つかりません'); return; }

  var price=_prodPrice(p);
  _qtyCtx={productType:pt, productId:id, name:_prodName(pt,p,id), price:price, isMl:isMl};

    presetsEl.style.display='flex';

    }).join('');

function renderCart(){
  var el=document.getElementById('cart-list');
  document.getElementById('cart-msg').textContent='';
  if(!_cart.length){ el.innerHTML='<div class="empty" style="padding:24px;text-align:center;color:#9a8470">カートは空です</div>'; }
  else{
    el.innerHTML=_cart.map(function(it,i){
      return '<div style="display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #f0ebe0">'
        +'<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:#18110a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.name)+'</div>'
        +'<div style="font-size:11px;color:#9a8470">'+it.qty+it.unit+' ・ '+yen(cartItemAmt(it))+'</div></div>'
        +'<button onclick="removeCartItem('+i+')" style="background:none;border:none;color:#8c2818;font-size:18px;cursor:pointer;padding:4px 8px">✕</button>'
      +'</div>';
    }).join('');
  }
  document.getElementById('cart-grand').textContent=yen(cartTotal());
  var btn=document.getElementById('cart-submit'); if(btn) btn.disabled=!_cart.length;
}
function removeCartItem(i){ _cart.splice(i,1); renderCart(); updateCartBar(); }

// ── その他ドリンク・フード ──
function openDrinksModal(){
  document.getElementById('drinks-modal').style.display='flex';
  if(_otherBottles!==null && _miscProducts!==null){ renderDrinks(); return; }
  Promise.all([
    db.collection('otherBottles').get().catch(function(){return {docs:[]};}),
    db.collection('miscProducts').get().catch(function(){return {docs:[]};})
  ]).then(function(res){
    _otherBottles=res[0].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    _miscProducts=res[1].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderDrinks();
  });
}
function closeDrinksModal(){ document.getElementById('drinks-modal').style.display='none'; }
function renderDrinks(){
  var el=document.getElementById('drinks-list');
  var sections='';
  function rowHtml(pt,b){
    var price=_prodPrice(b);
    var unit=pt==='other'?'/10ml':'/個';
    return '<div class="brow" style="border-bottom:1px solid #f0ebe0">'
      +'<div class="binfo"><span class="bn">'+esc(_prodName(pt,b,b.id))+'</span></div>'
      +(price>0?'<div class="bp">'+yen(price)+'<span style="font-size:10px;color:#9a8470">'+unit+'</span></div>':'<div class="bp none">—</div>')
      +(price>0?'<button onclick="openQtyModal(\''+pt+'\',\''+esc(b.id)+'\')" style="flex-shrink:0;margin-left:6px;background:#7a5610;color:#fff;border:none;border-radius:7px;width:30px;height:30px;font-size:17px;cursor:pointer">＋</button>':'')
    +'</div>';
  }
  var others=(_otherBottles||[]).filter(function(b){return _prodPrice(b)>0;});
  var miscs=(_miscProducts||[]).filter(function(b){return _prodPrice(b)>0;});
  if(others.length){
    sections+='<div style="font-size:12px;font-weight:700;color:#7a5610;margin:6px 2px 4px">その他のお酒</div><div class="blist">'+others.map(function(b){return rowHtml('other',b);}).join('')+'</div>';
  }
  if(miscs.length){
    sections+='<div style="font-size:12px;font-weight:700;color:#7a5610;margin:12px 2px 4px">フード・ソフトドリンク</div><div class="blist">'+miscs.map(function(b){return rowHtml('misc',b);}).join('')+'</div>';
  }
  el.innerHTML=sections||'<div class="empty" style="padding:24px;text-align:center;color:#9a8470">注文可能な商品がありません</div>';
}

// ── 注文送信 ──
function submitOrder(){
  if(!_cart.length) return;
  var btn=document.getElementById('cart-submit');
  var msg=document.getElementById('cart-msg');
  btn.disabled=true; msg.style.color='#4a3820'; msg.textContent='注文を送信中...';
  var items=_cart.map(function(it){ return {productType:it.productType, productId:it.productId, qty:it.qty}; });
  fbFunctions.httpsCallable('placeMemberOrder')({items:items}).then(function(res){
    var n=(res.data&&res.data.count)||items.length;
    _cart=[]; updateCartBar(); renderCart();
    msg.style.color='#1a6e58'; msg.textContent='✅ '+n+'件の注文を送信しました。スタッフが準備します。';
    menuToast('注文を送信しました');
    setTimeout(closeCartModal, 1400);
  }).catch(function(e){
    btn.disabled=false;
    msg.style.color='#8c2818'; msg.textContent='⚠️ '+((e&&e.message)||'注文に失敗しました');
    // 来店状態が切れている可能性があるため再確認
    if(e&&e.code==='functions/failed-precondition') initOrdering();
  });
}
</script>
