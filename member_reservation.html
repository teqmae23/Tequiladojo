<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>来場予約 - テキーラ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --red:#8c2818;--red-l:#fae8e4;
  --green:#1a6640;--green-l:#e4f2ea;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --sans:'Noto Sans JP',sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans);border:none}
input,select,textarea{font-family:var(--sans)}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 30% 60%,rgba(200,146,30,.07),transparent),var(--cream)}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 28px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:24px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-align:center;margin-bottom:6px}
.lsub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:28px}
.lcard label{display:block;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);outline:none}
.lcard input:focus{border-color:var(--gold)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:14px;font-weight:500}
.lbtn:hover{background:var(--gold)}
.lbtn:disabled{background:var(--cream3);color:var(--ink3);cursor:not-allowed}

#main-screen{display:none;max-width:520px;margin:0 auto;padding:20px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.title{font-size:20px;font-weight:700;color:var(--gold-d)}
.who{font-size:12px;color:var(--ink3)}
.linkbtn{font-size:12px;color:var(--ink2);background:var(--cream2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;text-decoration:none}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:18px 18px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--cream);color:var(--ink);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;line-height:1.6;color:var(--ink3);margin-top:4px}
.avail{font-size:13px;font-weight:500;border-radius:var(--r);padding:8px 10px;margin-top:6px}
.avail.ok{background:var(--green-l);color:var(--green)}
.avail.ng{background:var(--red-l);color:var(--red)}
.submit{width:100%;margin-top:8px;padding:14px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:15px;font-weight:600}
.submit:hover{background:var(--gold)}
.submit:disabled{background:var(--cream3);color:var(--ink3);cursor:not-allowed}
.req-item{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.req-item .rdate{font-weight:600;font-size:14px}
.req-item .rmeta{font-size:12px;color:var(--ink3);margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:2px 8px}
.b-pending{background:#fff3d6;color:#8a6d1a}
.b-approved{background:var(--green-l);color:var(--green)}
.b-rejected{background:var(--red-l);color:var(--red)}
.cancel{font-size:11px;color:var(--red);background:none;border:1px solid rgba(140,40,24,.3);border-radius:4px;padding:3px 9px;margin-top:8px}
.empty{font-size:13px;color:var(--ink3);text-align:center;padding:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:900;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
</head>
<body>

<!-- ログイン -->
<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">来場予約（本会員）</div>
    <label>会員ID または メールアドレス</label>
    <input id="l-id" type="text" autocomplete="username" placeholder="会員ID">
    <label>パスワード</label>
    <input id="l-pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <div class="lerr" id="l-err"></div>
    <button class="lbtn" id="l-btn">ログイン</button>
    <div class="note" style="text-align:center;margin-top:16px">
      <a href="/mypage.html" style="color:var(--ink3)">マイページへ</a> ・ <a href="/" style="color:var(--ink3)">トップへ</a>
    </div>
  </div>
</div>

<!-- メイン -->
<div id="main-screen">
  <div class="topbar">
    <div>
      <div class="title">来場予約</div>
      <div class="who" id="who"></div>
    </div>
    <div style="display:flex;gap:6px">
      <a class="linkbtn" href="/mypage.html">マイページ</a>
      <button class="linkbtn" id="btn-logout">ログアウト</button>
    </div>
  </div>

  <div class="card">
    <h2>予約を申請する</h2>
    <div class="fg">
      <label>ご希望日</label>
      <input id="r-date" type="date">
      <div class="avail" id="r-avail" style="display:none"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>開始時間</label><input id="r-start" type="time" value="19:00"></div>
      <div class="fg"><label>終了時間</label><input id="r-end" type="time" value="21:00"></div>
    </div>
    <div class="fg">
      <label>人数</label>
      <select id="r-guests"></select>
    </div>
    <div class="fg">
      <label>ご要望・備考（任意）</label>
      <textarea id="r-memo" rows="2" placeholder="アレルギー・記念日など"></textarea>
    </div>
    <button class="submit" id="r-submit">この内容で予約を申請</button>
    <div class="note">※ 申請後、スタッフの承認をもって予約が確定します。確定・変更はご連絡いたします。</div>
  </div>

  <div class="card">
    <h2>申請中・確定済みの予約</h2>
    <div id="req-list"><div class="empty">読み込み中...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"
});
const auth=firebase.auth();
const db=firebase.firestore();
const fbFunctions=firebase.app().functions('asia-northeast1');

const BT_LABEL=['夜のみ営業','昼夜営業','昼のみ営業','予約営業のみ','定休日','休業日','イベント営業','貸切営業','臨時休業'];
let currentMember=null;
let currentSchedule=null; // 選択日の営業予定

function g(id){return document.getElementById(id);}
function toast(msg){var t=g('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ymd6(dateStr){ // "2026-08-15" -> "260815"
  if(!dateStr) return '';
  var p=dateStr.split('-'); if(p.length!==3) return '';
  return p[0].slice(2)+p[1]+p[2];
}
function hhmmss(t){ // "19:00" -> "190000"
  if(!t) return ''; var p=t.split(':'); if(p.length<2) return '';
  return p[0].padStart(2,'0')+p[1].padStart(2,'0')+'00';
}
function fmtDateJP(ymd){ // 260815 -> 2026/08/15
  if(!ymd||ymd.length<6) return ymd||'';
  return '20'+ymd.slice(0,2)+'/'+ymd.slice(2,4)+'/'+ymd.slice(4,6);
}
function fmtT(hms){ if(!hms||hms.length<4) return hms||''; return hms.slice(0,2)+':'+hms.slice(2,4); }

// ── ログイン ────────────────────────────────────────────────
async function doLogin(){
  const raw=(g('l-id').value||'').trim();
  const pw=g('l-pw').value;
  const btn=g('l-btn'), err=g('l-err');
  if(!raw||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='ログイン中...';err.textContent='';
  try{
    if(!raw.includes('@')){
      try{
        const res=await fbFunctions.httpsCallable('loginWithMemberId')({memberId:raw,password:pw});
        await auth.signInWithCustomToken(res.data.token);
      }catch(e1){
        if(e1&&e1.code==='functions/unauthenticated') throw e1;
        await auth.signInWithEmailAndPassword(raw+'@tequiladojo.member', pw);
      }
    }else{
      await auth.signInWithEmailAndPassword(raw,pw);
    }
  }catch(e){
    let msg='ログインできませんでした';
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ||e.code==='functions/unauthenticated'||e.code==='functions/invalid-argument')msg='IDまたはパスワードが正しくありません';
    else if(e.code==='auth/too-many-requests'||e.code==='functions/resource-exhausted')msg='しばらく時間をおいてお試しください';
    err.textContent=msg;
    btn.disabled=false;btn.textContent='ログイン';
  }
}
g('l-btn').addEventListener('click',doLogin);
g('l-id').addEventListener('keydown',function(e){if(e.key==='Enter')g('l-pw').focus();});
g('l-pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });

// ── 認証状態 ────────────────────────────────────────────────
auth.onAuthStateChanged(async function(user){
  if(!user){
    g('login-screen').style.display='flex';
    g('main-screen').style.display='none';
    g('l-btn').disabled=false; g('l-btn').textContent='ログイン';
    currentMember=null;
    return;
  }
  // 会員ドキュメント解決（自分のドキュメントのみ読めるルールに適合）
  let memberDoc=null;
  try{
    const snap=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
    if(!snap.empty) memberDoc={id:snap.docs[0].id, ...snap.docs[0].data()};
  }catch(e){ console.warn('member lookup error', e); }
  if(!memberDoc){
    g('l-err').textContent='会員情報を確認できませんでした。マイページからログインし直してください。';
    await auth.signOut();
    return;
  }
  currentMember=memberDoc;
  g('login-screen').style.display='none';
  g('main-screen').style.display='block';
  g('who').textContent=(memberDoc.nickname||memberDoc.name||memberDoc.memberId||memberDoc.id)+' 様';
  initForm();
  loadMyRequests();
});

// ── フォーム初期化 ──────────────────────────────────────────
function initForm(){
  var dt=g('r-date');
  var today=new Date(); var iso=today.toISOString().slice(0,10);
  dt.min=iso;
  if(!dt.value) dt.value=iso;
  fillGuestOptions(6);
  dt.addEventListener('change',onDateChange);
  onDateChange();
}
function fillGuestOptions(max){
  var sel=g('r-guests'); var cur=parseInt(sel.value)||1;
  var m=Math.max(1, parseInt(max)||6);
  var html='';
  for(var i=1;i<=m;i++){ html+='<option value="'+i+'"'+(i===Math.min(cur,m)?' selected':'')+'>'+i+'名</option>'; }
  sel.innerHTML=html;
}
function onDateChange(){
  currentSchedule=null;
  var av=g('r-avail'); av.style.display='none';
  var ymd=ymd6(g('r-date').value);
  if(!ymd){ return; }
  var key='20'+ymd.slice(0,2)+ymd.slice(2,4)+ymd.slice(4,6); // YYYYMMDD
  db.collection('schedules').doc(key).get().then(function(doc){
    var cap=6, bt=null;
    if(doc.exists){ var d=doc.data(); currentSchedule=d; if(d.capacity!=null) cap=parseInt(d.capacity)||6; if(d.businessType!=null) bt=parseInt(d.businessType); }
    fillGuestOptions(cap);
    av.style.display='';
    if(bt===4||bt===5||bt===8){ av.className='avail ng'; av.textContent='この日は休業日のため予約を承れません（'+BT_LABEL[bt]+'）'; }
    else if(bt===7){ av.className='avail ng'; av.textContent='この日は貸切営業のため、通常予約は承れません。'; }
    else { av.className='avail ok'; av.textContent='席数（定員）'+cap+'名 ／ '+(bt!=null?BT_LABEL[bt]:'営業予定')+'。ご希望を申請いただけます。'; }
  }).catch(function(){ fillGuestOptions(6); });
}
function dayBlocked(){
  if(!currentSchedule) return false; // 予定未登録日は申請可（スタッフ判断）
  var bt=currentSchedule.businessType!=null?parseInt(currentSchedule.businessType):null;
  return bt===4||bt===5||bt===8||bt===7;
}

// ── 申請送信 ────────────────────────────────────────────────
g('r-submit').addEventListener('click',async function(){
  if(!currentMember){ toast('ログインが必要です'); return; }
  var dateStr=g('r-date').value;
  var ymd=ymd6(dateStr);
  var start=hhmmss(g('r-start').value);
  var end=hhmmss(g('r-end').value);
  var guests=parseInt(g('r-guests').value)||0;
  var memo=(g('r-memo').value||'').trim();

  if(!ymd){ toast('ご希望日を選択してください'); return; }
  if(!start||!end){ toast('時間を入力してください'); return; }
  if(start>=end){ toast('終了時間は開始時間より後にしてください'); return; }
  if(!guests){ toast('人数を選択してください'); return; }
  if(dayBlocked()){ toast('この日は予約を承れません'); return; }
  var cap=(currentSchedule&&currentSchedule.capacity!=null)?parseInt(currentSchedule.capacity)||6:6;
  if(guests>cap){ toast('人数が席数（'+cap+'名）を超えています'); return; }

  var btn=g('r-submit'); btn.disabled=true; btn.textContent='送信中...';
  try{
    await db.collection('reservationRequests').add({
      authUid: auth.currentUser.uid,
      memberId: String(currentMember.memberId||currentMember.id||''),
      memberName: String(currentMember.nickname||currentMember.name||''),
      reservationDate: ymd,
      startTime: start,
      endTime: end,
      guests: guests,
      memo: memo||null,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('予約を申請しました。承認をお待ちください。');
    g('r-memo').value='';
    loadMyRequests();
  }catch(e){
    toast('送信に失敗しました: '+(e.message||e.code||''));
  }
  btn.disabled=false; btn.textContent='この内容で予約を申請';
});

// ── 自分の申請一覧 ──────────────────────────────────────────
function loadMyRequests(){
  var el=g('req-list');
  db.collection('reservationRequests').where('authUid','==',auth.currentUser.uid).get()
    .then(function(snap){
      var rows=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
      rows.sort(function(a,b){ return String(b.reservationDate||'').localeCompare(String(a.reservationDate||'')); });
      if(!rows.length){ el.innerHTML='<div class="empty">まだ予約申請はありません</div>'; return; }
      el.innerHTML=rows.map(function(r){
        var st=r.status||'pending';
        var badge=st==='approved'?'<span class="badge b-approved">確定</span>'
                 :st==='rejected'?'<span class="badge b-rejected">見送り</span>'
                 :'<span class="badge b-pending">承認待ち</span>';
        var cancel=(st==='pending')?'<div><button class="cancel" data-cancel="'+esc(r.id)+'">申請を取り消す</button></div>':'';
        return '<div class="req-item">'
          +'<div style="display:flex;justify-content:space-between;align-items:center">'
          +'<span class="rdate">'+fmtDateJP(r.reservationDate)+'</span>'+badge+'</div>'
          +'<div class="rmeta">'+fmtT(r.startTime)+'〜'+fmtT(r.endTime)+' ／ '+(r.guests||'?')+'名'+(r.memo?'　'+esc(r.memo):'')+'</div>'
          +cancel+'</div>';
      }).join('');
    })
    .catch(function(e){ el.innerHTML='<div class="empty">読み込みに失敗しました</div>'; });
}

g('req-list').addEventListener('click',function(e){
  var b=e.target.closest('[data-cancel]'); if(!b) return;
  var id=b.getAttribute('data-cancel');
  if(!confirm('この予約申請を取り消しますか？')) return;
  db.collection('reservationRequests').doc(id).delete()
    .then(function(){ toast('申請を取り消しました'); loadMyRequests(); })
    .catch(function(){ toast('取り消しに失敗しました'); });
});
</script>
<script src="/access-log.js?v=20260826"></script>
</body>
</html>
