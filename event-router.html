<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント | テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;background:#faf7f1;color:#18110a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:380px;width:100%;text-align:center;background:#fff;border:1px solid rgba(160,130,100,.32);border-radius:14px;padding:32px 24px;box-shadow:0 6px 36px rgba(24,17,10,.10)}
  .ic{font-size:40px;margin-bottom:10px}
  .msg{font-size:14px;line-height:1.9;color:#3a2c14}
  .sub{font-size:12px;color:#8a7a60;margin-top:4px}
  a.btn{display:inline-block;margin-top:16px;padding:11px 18px;background:#7a5610;color:#faf7f1;border-radius:8px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="box"><div class="ic">🎪</div><div class="msg" id="msg">読み込み中…</div></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"
});
var auth=firebase.auth(), db=firebase.firestore();
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function show(html){ document.getElementById('msg').innerHTML=html; }
// パスからスラッグを取り出す（先頭/・末尾/・.html/.htm を除去）
function slugFromPath(){ return decodeURIComponent((location.pathname||'').replace(/^\/+/,'').replace(/\/+$/,'').replace(/\.html?$/i,'')); }
function norm(s){ return String(s||'').trim().replace(/^\/+/,'').replace(/\.html?$/i,'').toLowerCase(); }
var slug=slugFromPath();

if(!slug){
  show('ページが見つかりませんでした。<br><a class="btn" href="/member.html">会員ページへ</a>');
}else{
  auth.onAuthStateChanged(function(user){
    if(!user){
      show('このイベントページの閲覧には会員ログインが必要です。<br><a class="btn" href="/member.html">▶ 会員ページでログイン</a>');
      return;
    }
    db.collection('events').where('published','==',true).get().then(function(snap){
      var hit=null;
      snap.forEach(function(d){ if(!hit && norm((d.data()||{}).topPageUrl)===slug.toLowerCase()) hit=d.id; });
      if(hit){ location.replace('/event.html?id='+encodeURIComponent(hit)); }
      else { show('「'+esc(slug)+'」のイベントページは見つかりませんでした。<br><span class="sub">URLが正しいかご確認ください。</span><br><a class="btn" href="/member.html">会員ページへ</a>'); }
    }).catch(function(){
      show('読み込みに失敗しました。<br><a class="btn" href="/member.html">会員ページへ</a>');
    });
  });
}
</script>
</body>
</html>
