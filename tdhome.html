<style>
:root {
  --ink:#18110a; --ink2:#4a3820; --ink3:#9a8470;
  --gold:#c8921e; --gold-l:#e8b84a; --gold-d:#7a5610;
  --teal:#1a6e58; --teal-l:#e0f0eb;
  --red:#8c2818; --red-l:#fae8e4;
  --cream:#faf7f1; --cream2:#f0ebe0; --cream3:#e4ddd0; --white:#fff;
  --border:rgba(160,130,100,.18); --border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07); --shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:6px; --rl:12px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Noto Sans JP',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
input{font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 30% 60%,rgba(200,146,30,.07),transparent),var(--cream)}
.lcard{width:100%;max-width:380px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:44px 36px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:44px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-align:center;margin-bottom:2px}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:32px}
.lcard label{display:block;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream);color:var(--ink)}
.lcard input:focus{outline:none;border-color:var(--gold)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:22px;padding:13px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px;font-weight:500}
.lbtn:hover{background:var(--gold)}
#app{display:none}
.topbar{background:var(--ink);padding:8px 16px 10px;display:flex;flex-direction:column;align-items:stretch;gap:3px}
.home-body{padding:32px 20px 60px;max-width:860px;margin:0 auto}
.home-sub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:22px}

/* ── 日常業務タイル ── */
.tile-section-label{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;margin:6px 0 14px;padding-left:2px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.home-tile{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:26px 14px;text-align:center;cursor:pointer;transition:box-shadow .15s,transform .1s,border-color .15s;display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:inherit}
.home-tile:hover{box-shadow:0 4px 18px rgba(24,17,10,.12);transform:translateY(-2px);border-color:var(--border2)}
.tile-icon{font-size:32px;line-height:1}
.tile-label{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.tile-desc{font-size:10px;color:var(--ink3)}
.tile-admin{background:linear-gradient(135deg,#fdf3dc,#f4e8cf);border-color:var(--border2);grid-column:1/-1}
.tile-admin .tile-label{color:var(--gold-d);font-size:16px}
.tile-admin .tile-icon{font-size:30px}

/* ── 管理業務ツリー ── */
.back-btn{background:var(--cream2);border:1px solid var(--border2);color:var(--ink2);padding:8px 16px;border-radius:20px;font-size:13px;margin-bottom:16px;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{background:var(--cream3)}
.admin-title{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--gold-d);letter-spacing:.08em;padding-bottom:8px;border-bottom:2px solid var(--border2);margin-bottom:16px}
.nav-wrap{width:100%;max-width:820px;margin:0 auto}
.nav-group{border-left:2px solid var(--border);margin:4px 0 4px 2px}
.nav-kids{padding-left:16px}
.nav-sum{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r);font-weight:600;color:var(--ink2);font-size:14px}
.nav-sum::-webkit-details-marker{display:none}
.nav-sum:hover{background:var(--cream2)}
.nav-sum::before{content:'▸';color:var(--gold);font-size:11px;transition:transform .15s;flex:0 0 auto}
details[open]>.nav-sum::before{transform:rotate(90deg)}
.nav-open{margin-left:auto;font-size:11px;color:var(--teal);text-decoration:none;border:1px solid var(--border2);padding:2px 9px;border-radius:12px;white-space:nowrap}
.nav-open:hover{background:var(--teal-l)}
.nav-leaf{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:3px 0;background:var(--white);border:1px solid var(--border);border-radius:var(--r);text-decoration:none;color:inherit;cursor:pointer}
.nav-leaf:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.nav-ic{width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-lb{flex:1;min-width:0;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.nav-note{font-size:10px;color:var(--ink3);font-weight:400}
.nav-ar{color:var(--border2);font-size:14px;flex:0 0 auto}
.nav-leaf:hover .nav-ar{color:var(--gold)}
.nav-sum .nav-ic{width:30px;height:30px;font-size:16px}
.nav-sum .nav-lb{flex:0 0 auto}

/* 大項目カラーグループ */
.nav-top{border-radius:var(--rl);padding:6px 12px 10px;margin-bottom:14px;border:1px solid var(--border)}
.nav-top>.nav-group{border-left:none;margin:0}
.nav-top>.nav-group>.nav-sum{font-size:18px;font-weight:700;padding:12px 8px;letter-spacing:.03em}
.nav-top>.nav-group>.nav-sum::before{font-size:13px}
.nav-top>.nav-group>.nav-sum .nav-ic{width:34px;height:34px;font-size:19px}
.nav-top>.nav-group>.nav-kids{padding-left:8px}
.nav-c0{background:#eef4fb;border-color:#cfe0f2}
.nav-c0>.nav-group>.nav-sum{color:#0c447c}
.nav-c0>.nav-group>.nav-sum .nav-ic{background:#dbe9f8}
.nav-c1{background:#eef7f0;border-color:#cfe6d5}
.nav-c1>.nav-group>.nav-sum{color:#1a6640}
.nav-c1>.nav-group>.nav-sum .nav-ic{background:#dcefe1}
.nav-c2{background:#fbf3ea;border-color:#eeddc6}
.nav-c2>.nav-group>.nav-sum{color:#7a5610}
.nav-c2>.nav-group>.nav-sum .nav-ic{background:#f4e6d3}
.nav-c3{background:#f6eef8;border-color:#e4d2ea}
.nav-c3>.nav-group>.nav-sum{color:#6b3fa0}
.nav-c3>.nav-group>.nav-sum .nav-ic{background:#ecdcf1}
.nav-c4{background:#fdf0ee;border-color:#f2d5cf}
.nav-c4>.nav-group>.nav-sum{color:#a3332a}
.nav-c4>.nav-group>.nav-sum .nav-ic{background:#f8ddd8}
.nav-c5{background:#eef7f6;border-color:#cfe6e2}
.nav-c5>.nav-group>.nav-sum{color:#1a6e58}
.nav-c5>.nav-group>.nav-sum .nav-ic{background:#dcefec}
.nav-c6{background:#f5f2ec;border-color:#e2dccf}
.nav-c6>.nav-group>.nav-sum{color:#6a5636}
.nav-c6>.nav-group>.nav-sum .nav-ic{background:#ebe5d9}
.nav-c7{background:#eef1f6;border-color:#d3dae6}
.nav-c7>.nav-group>.nav-sum{color:#3a4a63}
.nav-c7>.nav-group>.nav-sum .nav-ic{background:#dde3ee}
.nav-top .nav-sum:hover{background:rgba(255,255,255,.55)}

/* ── オーナー専用要素 ── */
.owner-only{display:none}
.role-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.06em;margin-left:8px}
.badge-owner{background:#7a5610;color:#e8b84a}
.badge-staff{background:#1a4a3a;color:#7adf7a}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--white);border-radius:var(--rl);padding:28px 24px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.staff-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.staff-row:last-child{border-bottom:none}
.staff-email{flex:1;color:var(--ink2)}
.staff-role-sel{padding:5px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--cream);cursor:pointer}
.staff-att{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;cursor:pointer;flex:0 0 auto}
.staff-att-na{font-size:11px;color:var(--ink3);flex:0 0 auto}
.btn-sm{padding:5px 12px;border-radius:var(--r);font-size:12px;border:none;cursor:pointer;font-weight:500}
.btn-danger{background:#fae8e4;color:var(--red)}
.btn-primary-sm{background:var(--gold-d);color:var(--cream)}
.fi-sm{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--cream);width:100%}
.add-staff-form{background:var(--cream2);border-radius:var(--r);padding:14px;margin-top:12px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🥃</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">Admin Console</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" placeholder="owner@example.com">
    <label>パスワード</label>
    <input type="password" id="lpass" placeholder="••••••••">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div style="text-align:center;font-family:var(--serif);font-size:19px;color:var(--gold-l);letter-spacing:.12em">🥃 テキーラ道場</div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;color:rgba(255,255,255,.4)" id="user-email"></span>
      <span id="role-badge" class="role-badge" style="display:none"></span>
      <button id="btn-logout" style="margin-left:auto;padding:5px 12px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:none;color:rgba(255,255,255,.38);font-size:11px">ログアウト</button>
    </div>
  </div>

  <div class="home-body">
    <!-- 日常業務（タイル） -->
    <div id="view-daily">
      <div class="home-sub" id="today-label"></div>
      <div class="tile-section-label">日常業務</div>
      <div class="home-grid" id="daily-grid"></div>
    </div>

    <!-- 管理業務（ツリー） -->
    <div id="view-admin" style="display:none">

      <div class="admin-title">管理業務</div>
      <div class="nav-wrap" id="nav-root"></div>
    </div>
  </div>

<!-- スタッフ管理モーダル（ownerのみ） -->
<div class="modal-overlay" id="modal-staff">
  <div class="modal-box">
    <div class="modal-title">👤 スタッフ管理
      <button onclick="closeStaffModal()" style="margin-left:auto;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink3)">✕</button>
    </div>
    <div id="staff-list-area" style="min-height:60px;color:var(--ink3);font-size:13px">読み込み中...</div>
    <div class="add-staff-form" style="margin-top:16px">
      <div style="font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px">新しいスタッフを追加</div>
      <div style="font-size:11px;color:var(--ink3);margin-bottom:8px">登録済みの本会員（active）のメールアドレスを指定してください</div>
      <label style="font-size:11px;color:var(--ink3);display:block;margin-bottom:4px">メールアドレス</label>
      <input type="email" class="fi-sm" id="new-staff-email" placeholder="staff@example.com" style="margin-bottom:8px">
      <label style="font-size:11px;color:var(--ink3);display:block;margin-bottom:4px">役割</label>
      <select class="fi-sm" id="new-staff-role" style="margin-bottom:12px">
        <option value="staff">staff（スタッフ）</option>
        <option value="owner">owner（オーナー）</option>
      </select>
      <div id="add-staff-err" style="font-size:12px;color:var(--red);min-height:14px;margin-bottom:8px"></div>
      <button class="btn-sm btn-primary-sm" onclick="addStaff()" style="width:100%;padding:10px">追加する</button>
    </div>
  </div>
</div>

</div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth      = firebase.auth();
var functions = firebase.app().functions('asia-northeast1');
var db        = firebase.firestore();

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function g(id){ return document.getElementById(id); }

// ── 日常業務タイル ──────────────────────────────────────────────
var DAILY = [
  { label:'開店・閉店', href:'openclose.html',        icon:'🏮', desc:'セッション管理' },
  { label:'来場者一覧', href:'checkin.html',          icon:'👥', desc:'来場者の登録・管理' },
  { label:'注文一覧',   href:'home_order.html',       icon:'📋', desc:'注文の受付・登録' },
  { label:'出退勤',     href:'attendance.html',       icon:'🕐', desc:'スタッフの出勤・退勤' },
  { label:'来店QR',     href:'admin_checkin_qr.html', icon:'📷', desc:'店頭掲示の来店QR' },
  { label:'新規登録QR', href:'admin_register_qr.html', icon:'🆕', desc:'店頭掲示の新規登録QR' },
  { label:'TOPページ',  href:'index.html',            icon:'🌐', desc:'公開サイト' }
];
function renderDaily(){
  var html = DAILY.map(function(t){
    return '<a class="home-tile" href="'+t.href+'"><div class="tile-icon">'+t.icon+'</div>'
      + '<div class="tile-label">'+esc(t.label)+'</div><div class="tile-desc">'+esc(t.desc)+'</div></a>';
  }).join('');
  // よく使う管理ページへのショートカット（オーナーのみ表示）
  var SHORTCUTS = [
    { label:'蒸留所ツリー',   href:'admin_distillery.html',          icon:'🏭', desc:'地区・所在地・蒸留所' },
    { label:'顧客マスタ管理', href:'admin_customer.html?tab=members', icon:'👤', desc:'会員・座席・グレード' },
    { label:'営業実績管理',   href:'admin_data.html',                icon:'📊', desc:'営業・来店・注文データ' }
  ];
  html += SHORTCUTS.map(function(t){
    return '<a class="home-tile owner-only" href="'+t.href+'"><div class="tile-icon">'+t.icon+'</div>'
      + '<div class="tile-label">'+esc(t.label)+'</div><div class="tile-desc">'+esc(t.desc)+'</div></a>';
  }).join('');
  // 管理業務タイル（オーナーのみ表示。押すと管理ツリーへ）
  html += '<div class="home-tile tile-admin owner-only" onclick="showAdmin()">'
    + '<div class="tile-icon">🗂️</div><div class="tile-label">管理業務</div>'
    + '<div class="tile-desc">マスタ・実績・インポート・コンテンツ・アクセス管理</div></div>';
  g('daily-grid').innerHTML = html;
}

// ── 管理業務ツリー ──────────────────────────────────────────────
// leaf : {label, href|action, icon, note?}   group: {label, icon, href?, children:[…]}
var NAV = [
  { label:'マスタ管理', icon:'⚙️', children:[
    { label:'蒸留所管理', icon:'🏭', href:'admin_distillery.html', children:[
      { label:'地区',       href:'admin_distillery.html?tab=districts',    icon:'🗾' },
      { label:'所在地',     href:'admin_distillery.html?tab=locations',    icon:'📍' },
      { label:'蒸留所',     href:'admin_distillery.html?tab=distilleries', icon:'🏭' },
      { label:'CRT同期',    href:'admin_distillery.html?tab=crt-sync',     icon:'🔄' },
      { label:'マップ図形', href:'admin_distillery.html?tab=map-overlays', icon:'🗺' }

      { label:'ボトルデータ', href:'admin_tequila.html?tab=bdata',   icon:'📋' },
      { label:'相場照合',     href:'admin_tequila.html?tab=market',  icon:'🔗' },

      { label:'海外相場',     href:'admin_tequila.html?tab=intl',    icon:'🌎' },

    ]},
    { label:'その他商品管理', icon:'🍷', href:'admin_other.html', children:[
      { label:'カクテルマスタ',    href:'admin_other.html?tab=cocktail',   icon:'🍸' },

      { label:'大分類',            href:'admin_other.html?tab=ocat1',      icon:'🗂' },

      { label:'小分類',            href:'admin_other.html?tab=ocat3',      icon:'🗂' },
      { label:'ボトルデータ(他)',  href:'admin_other.html?tab=obottles',   icon:'🍾' },
      { label:'種別',              href:'admin_other.html?tab=mkinds',     icon:'🏷' },

      { label:'ブラインドマーク',  href:'admin_other.html?tab=blindmarks', icon:'🎭' }
    ]},
    { label:'顧客管理', icon:'👤', children:[
      { label:'会員',             href:'admin_customer.html?tab=members', icon:'🧑' },
      { label:'座席レイアウト',   href:'admin_customer.html?tab=layouts', icon:'🪑' },
      { label:'グレード管理',     href:'admin_plans.html',    icon:'🎫', note:'旧・会員グレード' },
      { label:'バッジ管理',       href:'admin_badges.html',   icon:'🎖️' },
      { label:'デポジット・ツケ', href:'admin_deposit.html',  icon:'💰' },
      { label:'キープボトル管理', href:'admin_keepbottle.html', icon:'🍾' }
    ]}
  ]},
  { label:'営業実績管理', icon:'📊', children:[
    { label:'営業データ', icon:'📊', href:'admin_data.html', children:[
      { label:'営業データ',   href:'admin_data.html?tab=sessions',     icon:'📊' },

function navLeafHtml(n){
  var note = n.note ? '<span class="nav-note">'+esc(n.note)+'</span>' : '';
  var inner = '<span class="nav-ic">'+n.icon+'</span><span class="nav-lb">'+esc(n.label)+note+'</span><span class="nav-ar">→</span>';
  if(n.action) return '<div class="nav-leaf" onclick="'+n.action+'">'+inner+'</div>';
  return '<a class="nav-leaf" href="'+n.href+'">'+inner+'</a>';
}
function navGroupHtml(n){
  var head = '<summary class="nav-sum"><span class="nav-ic">'+n.icon+'</span><span class="nav-lb">'+esc(n.label)+'</span>'
    + (n.href ? '<a class="nav-open" href="'+n.href+'" onclick="event.stopPropagation()">開く →</a>' : '') + '</summary>';
  var kids = '<div class="nav-kids">'+n.children.map(navNodeHtml).join('')+'</div>';
  return '<details class="nav-group" open>'+head+kids+'</details>';
}
function navNodeHtml(n){ return n.children ? navGroupHtml(n) : navLeafHtml(n); }
function renderNav(){ g('nav-root').innerHTML = NAV.map(function(n,i){ return '<div class="nav-top nav-c'+(i%8)+'">'+navNodeHtml(n)+'</div>'; }).join(''); }

// ── スタッフ管理 ───────────────────────────────────────────────
function openStaffModal(){ g("modal-staff").classList.add("open"); loadStaffList(); }
function closeStaffModal(){ g("modal-staff").classList.remove("open"); }
g("modal-staff").addEventListener("click",function(e){ if(e.target===this) closeStaffModal(); });

async function loadStaffList(){
  var area=g("staff-list-area");
  area.textContent="読み込み中...";
  try{
    var res=await Promise.all([
      functions.httpsCallable("getStaffList")({}),
      db.collection("members").where("role","in",["owner","staff"]).get().catch(function(){return {docs:[]};})
    ]);
    var list=res[0].data.staff||[];
    // uid/email から会員doc（開店時デフォルト出勤フラグ）を引けるようにする
    var byUid={}, byEmail={};
    res[1].docs.forEach(function(d){ var m=d.data()||{}; var o={id:d.id, def:!!m.defaultAttend}; if(m.authUid) byUid[m.authUid]=o; if(m.email) byEmail[String(m.email).toLowerCase()]=o; });
    if(!list.length){ area.innerHTML='<div style="color:var(--ink3);padding:12px 0">スタッフが登録されていません</div>'; return; }
    area.innerHTML=list.map(function(s){
      var mm=byUid[s.uid]||(s.email?byEmail[String(s.email).toLowerCase()]:null)||null;
      var att = mm
        ? '<label class="staff-att" title="開店画面で出勤にデフォルトチェックを付ける"><input type="checkbox"'+(mm.def?" checked":"")+' onchange="toggleStaffDefaultAttend(\''+esc(mm.id)+'\',this.checked)"> 開店時に出勤</label>'
        : '<span class="staff-att-na" title="会員データが見つかりません">—</span>';
      return '<div class="staff-row">'+
        '<span class="staff-email">'+esc(s.email||s.uid)+'</span>'+
        att+
        '<select class="staff-role-sel" data-uid="'+esc(s.uid)+'" onchange="updateStaffRole(this)">'+
          '<option value="staff"'+(s.role==="staff"?" selected":"")+'>staff</option>'+
          '<option value="owner"'+(s.role==="owner"?" selected":"")+'>owner</option>'+
        '</select>'+
        '<button class="btn-sm btn-danger" data-uid="'+esc(s.uid)+'" data-email="'+esc(s.email||'')+'" onclick="removeStaffByAttr(this)">削除</button>'+
      '</div>';
    }).join('');
  }catch(e){ area.innerHTML='<div style="color:var(--red)">読み込み失敗: '+esc(e.message)+'</div>'; }
}
async function updateStaffRole(sel){
  try{ await functions.httpsCallable("setUserRole")({uid:sel.dataset.uid,role:sel.value}); showToast("変更しました"); }
  catch(e){ showToast("失敗: "+e.message,true); loadStaffList(); }
}
// 開店時のデフォルト出勤フラグ（会員docに保存）。開店画面の出勤リストで初期チェックに使う。
async function toggleStaffDefaultAttend(memberId, val){
  try{ await db.collection("members").doc(memberId).set({defaultAttend:!!val},{merge:true}); showToast(val?"開店時に出勤（デフォルトON）":"デフォルト出勤OFF"); }
  catch(e){ showToast("失敗: "+e.message,true); loadStaffList(); }
}
function removeStaffByAttr(btn){ removeStaff(btn.dataset.uid,btn.dataset.email); }
async function removeStaff(uid,email){
  if(!confirm((email||uid)+" をスタッフから削除しますか？")) return;
  try{ await functions.httpsCallable("setUserRole")({uid:uid,role:null}); showToast("削除しました"); loadStaffList(); }
  catch(e){ showToast("失敗: "+e.message,true); }
}
async function addStaff(){
  var email=g("new-staff-email").value.trim();
  var role=g("new-staff-role").value;
  var err=g("add-staff-err");
  err.textContent="";
  if(!email){ err.textContent="メールアドレスを入力してください"; return; }
  try{
    var memSnap=await db.collection("members").where("email","==",email).limit(1).get();
    if(memSnap.empty){
      err.textContent="このメールアドレスの会員が見つかりません。先に会員登録を完了してください。";
      return;
    }
    var mem=memSnap.docs[0].data();
    if(mem.status!=="active"){
      err.textContent="スタッフ登録は本会員（active）のみ可能です。先に会員登録を完了してください。";
      return;
    }
    if(!mem.authUid){
      err.textContent="この会員にはログインアカウントが連携されていません。";
      return;
    }
    await functions.httpsCallable("setUserRole")({uid:mem.authUid,role:role});
    g("new-staff-email").value="";
    showToast(email+" を "+role+" として追加しました");
    loadStaffList();
  }catch(e){ err.textContent="失敗: "+e.message; }
}
function showToast(msg,isErr){
  var t=document.createElement("div");
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;"+(isErr?"background:#3a1a1a;color:#df7a7a;border:1px solid #6a2d2d":"background:#1a3a1a;color:#7adf7a;border:1px solid #2d6a2d");
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },3000);
}
</script>
