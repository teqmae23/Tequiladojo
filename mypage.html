<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>マイページ - テキーラ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --red:#8c2818;--red-l:#fae8e4;
  --green:#1a6640;--green-l:#e4f2ea;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --serif:'Noto Sans JP',sans-serif;
  --sans:'Noto Sans JP',sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans);border:none}
input,select{font-family:var(--sans)}

/* ─── ログイン画面 ─── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 30% 60%,rgba(200,146,30,.07),transparent),var(--cream)}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 28px;box-shadow:var(--shadow-lg)}
.lbrand{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-align:center;margin-bottom:6px}
.lsub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:28px}
.lcard label{display:block;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);outline:none}
.lcard input:focus{border-color:var(--gold)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:14px;font-weight:500;transition:background .15s}
.lbtn:hover{background:var(--gold)}
.lbtn:disabled{background:var(--cream3);color:var(--ink3);cursor:not-allowed}

/* ─── メイン ─── */
#main-screen{display:none}
.topbar{background:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.top-brand{font-size:14px;color:var(--gold-l);letter-spacing:.04em;flex:1;font-weight:500}
.top-home-btn{background:none;border:1px solid rgba(200,146,30,.6);color:var(--gold-l);padding:5px 12px;border-radius:var(--r);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;}
.top-home-btn:hover{background:rgba(200,146,30,.15);}
.top-logout{background:none;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.7);padding:5px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.top-logout:hover{border-color:rgba(255,255,255,.7);color:#fff;}
.top-logout:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.6)}

.container{max-width:600px;margin:0 auto;padding:16px}

/* プロフィールバー */
.profile-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow)}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:var(--gold-d);color:var(--cream);font-family:var(--serif);font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.profile-avatar svg{width:34px;height:34px;opacity:.85}
.profile-name-area{flex:1;min-width:0}
.profile-name{font-size:18px;font-weight:700;color:var(--ink);margin-top:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-id{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.04em}
/* 会員区分バッジ */
.mem-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.06em}
.mb-active{background:#e0f5e0;color:#1a6e1a;border:1px solid #7adf7a}
.mb-pending{background:#fff0dc;color:#b06000;border:1px solid #f0c080}
.mb-temp{background:#e0eeff;color:#1a3a8a;border:1px solid #80a8f0}
.mb-guest{background:#e8ddd0;color:#5a3a1a;border:1px solid #c0a080}
/* 認証メール再送ボタン */
.btn-resend{padding:4px 10px;border-radius:10px;font-size:11px;font-weight:500;background:none;border:1px solid var(--gold-d);color:var(--gold-d);cursor:pointer;white-space:nowrap}
.btn-resend:hover{background:var(--gold-d);color:var(--cream)}
.profile-stat-lbl{font-size:10px;color:var(--ink3);letter-spacing:.06em}
/* CLASSバッジ */
.class-badge{display:inline-block;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.class-blanco{background:#f5f5f5;color:#555;border:1px solid #ccc}
.class-reposado{background:#fff0dc;color:#b06000;border:1px solid #f0c080}
.class-anejo{background:#ffe0b0;color:#7a3800;border:1px solid #e09040}
.class-x-anejo{background:#3a1a00;color:#e8b84a;border:1px solid #7a5610}
/* 段位 */
.rank-badge{font-family:var(--mono);font-size:12px;color:var(--ink2)}
/* フィルターを sec-header の下に移動するため非表示にしない */
.filter-bar-inner{padding:10px 0 4px;border-bottom:1px solid var(--cream3);margin-bottom:10px}

/* フィルター */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fi{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--white);font-size:13px;color:var(--ink);outline:none}
.fi:focus{border-color:var(--gold)}
select.fi{min-width:80px}
.filter-label{font-size:12px;color:var(--ink3);white-space:nowrap}
.btn-filter-reset{padding:6px 12px;background:var(--cream2);border:1px solid var(--border2);border-radius:var(--r);font-size:12px;color:var(--ink3)}
.btn-filter-reset:hover{color:var(--ink);border-color:var(--gold)}

/* サマリーバー */
.summary-bar{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sum-chip{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--ink3);flex:1;min-width:100px;text-align:center}
.sum-chip strong{display:block;font-family:var(--serif);font-size:18px;color:var(--gold-d);font-weight:600}

/* 来場リスト */
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--cream3)}
.sec-title{font-family:var(--serif);font-size:17px;font-weight:600}
.sec-count{background:var(--cream2);color:var(--ink3);font-size:11px;padding:2px 8px;border-radius:10px;font-family:var(--mono)}

.visit-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s}
.visit-card:hover{box-shadow:0 3px 16px rgba(24,17,10,.12)}
.visit-card.open{border-color:var(--gold-d)}
.visit-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.visit-date{font-size:15px;font-weight:600;color:var(--ink)}
.visit-time{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.visit-badges{display:flex;gap:5px;margin-left:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.badge-blind{background:#f3eaff;color:#6b3fa0}
.badge-items{background:var(--cream2);color:var(--ink3)}
.visit-amount{margin-left:auto;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--gold-d);white-space:nowrap}
.visit-tequila{font-size:11px;color:var(--ink3);text-align:right;margin-top:1px}
.visit-chevron{font-size:12px;color:var(--ink3);margin-left:6px;transition:transform .2s;flex-shrink:0}
.visit-card.open .visit-chevron{transform:rotate(180deg)}

/* 注文詳細パネル */
.visit-detail{display:none;border-top:1px solid var(--border);background:var(--cream)}
.visit-card.open .visit-detail{display:block}
.og-item.og-item-cancelled{opacity:.5}
.og-item-cancelled-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--red-l);color:var(--red);border:1px solid var(--red);flex-shrink:0}

.order-group{border-bottom:1px solid var(--border)}
.order-group:last-child{border-bottom:none}
.og-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cream2)}
.og-time{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.og-badge{font-size:10px;padding:1px 6px;border-radius:8px}
.og-together{font-size:11px;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:2px;flex-shrink:0}
.og-together:hover{color:var(--gold-d)}
.together-popup{position:fixed;background:var(--white);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow-lg);z-index:500;font-size:12px;min-width:120px;max-width:200px}
.together-popup-name{padding:3px 0;color:var(--ink2);display:flex;align-items:center;gap:6px}
.og-total{margin-left:auto;font-size:12px;font-weight:600;color:var(--gold-d)}
.og-items{}
.og-item{display:flex;align-items:center;padding:8px 14px 8px 24px;border-bottom:1px solid var(--border);gap:8px;font-size:13px}
.og-item:last-child{border-bottom:none}
.og-item-mark{font-size:14px;flex-shrink:0}
.og-item-name{flex:1;color:var(--ink)}
.og-item-qty{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.og-item-price{font-size:12px;color:var(--gold-d);font-weight:500;white-space:nowrap}

/* ブラインド結果ボタン */
.blind-result-btn{margin:8px 14px 10px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f3eaff;border:1px solid #c9a8f0;border-radius:var(--r);cursor:pointer;font-size:12px;color:#6b3fa0;width:calc(100% - 28px)}
.blind-result-btn:hover{background:#ecdeff}
/* ブラインド結果テーブル（checkin.htmlと共通） */
.bpop-info{padding:8px 14px;background:var(--cream);font-size:12px;color:var(--ink2);border-bottom:1px solid var(--border)}
.bpop-table-wrap{overflow-x:auto}
.bpop-table{border-collapse:collapse;width:100%;font-size:12px}
.bpop-table th,.bpop-table td{border:1px solid var(--border2);padding:4px 3px;text-align:center;white-space:nowrap}
.bpop-table th{background:var(--cream2);font-size:10px;font-weight:600;color:var(--ink3)}
.bpop-table th.name-th{text-align:left;padding-left:8px}
.bpop-table td.name-td{text-align:left;padding-left:8px;font-weight:600;font-size:12px;min-width:60px}
.bpop-table td.correct{background:#d4edda}
.bpop-table td.wrong{background:#f8d7da}
.bpop-table td.score-td{font-family:var(--mono);font-weight:700;color:var(--gold-d)}
.bpop-legend{padding:8px 14px;background:var(--cream);border-top:1px solid var(--border)}
.bpop-legend-title{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.bpop-legend-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
.bpop-legend-num{min-width:22px;text-align:center}

/* ブラインド結果モーダル */
#blind-modal{display:none;position:fixed;inset:0;background:rgba(24,17,10,.55);z-index:200;align-items:center;justify-content:center;padding:16px}
#blind-modal.open{display:flex}
.bm-panel{background:var(--white);border-radius:var(--rl);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.bm-header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px}
.bm-title{font-family:var(--serif);font-size:18px;font-weight:600;flex:1}
.bm-close{background:none;border:1px solid var(--border2);color:var(--ink3);padding:5px 10px;border-radius:var(--r);font-size:13px}
.bm-body{padding:16px}
.bm-score{text-align:center;padding:16px 0 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.bm-score-num{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1}
.bm-score-num.win{color:var(--gold-d)}
.bm-score-num.lose{color:var(--ink3)}
.bm-score-lbl{font-size:13px;color:var(--ink3);margin-top:4px}
.bm-winner{font-size:12px;color:var(--green);font-weight:500;margin-top:8px}
.bm-ans-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.bm-ans-row:last-child{border-bottom:none}
.bm-ans-mark{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.bm-ans-actual{flex:1;color:var(--ink2)}
.bm-ans-arrow{color:var(--ink3);font-size:11px}
.bm-ans-guess{flex:1;color:var(--ink3)}
.bm-ans-result{font-size:14px;flex-shrink:0}
.bm-ans-row.correct .bm-ans-guess{color:var(--green);font-weight:500}
.bm-ans-row.wrong .bm-ans-guess{color:var(--red)}

/* ローディング・空状態 */
.loading{text-align:center;padding:40px;color:var(--ink3);font-size:14px}
.empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:14px}
.empty-icon{font-size:32px;margin-bottom:10px}

/* 来場ステータスチップ */
.vstatus{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap}
.vstatus-active{background:#fff0d8;color:#9a5c00;border:1px solid #e8b84a}
.vstatus-last{background:var(--cream2);color:var(--ink3);border:1px solid var(--border)}
.vstatus-none{background:var(--cream2);color:var(--ink3);border:1px solid var(--border)}
/* データ確認バナー */
.debug-banner{background:#fff8e1;border:1px solid #f0c040;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:12px;color:#7a5610;display:none}
.debug-banner.show{display:block}
</style>
</head>
<body>
<style id="auth-hide-style">
  #login-screen, #main-screen { visibility: hidden; }
</style>

<!-- ─── ログイン ─── -->
<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">会員マイページ</div>
    <label>会員ID または メールアドレス</label>
    <input type="text" id="l-id" placeholder="26XXXX または メールアドレス" autocomplete="username">
    <label>パスワード</label>
    <div style="position:relative;">
      <input type="password" id="l-pw" placeholder="パスワード" autocomplete="current-password" style="width:100%;padding-right:44px;">
      <button type="button" onclick="var i=document.getElementById('l-pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈';" style="position:absolute;right:0;top:0;bottom:0;width:40px;background:none;border:none;cursor:pointer;font-size:16px;">👁</button>
    </div>
    <div class="lerr" id="l-err"></div>
    <button class="lbtn" id="l-btn" onclick="doLogin()">ログイン</button>
    <div style="margin-top:16px;text-align:center;padding-top:14px;border-top:1px solid var(--border2);">
      <a href="/member_register2.html" style="font-size:16px;color:#e07820;font-weight:700;text-decoration:none;">新規ユーザー登録はこちら</a>
    </div>
  </div>
</div>

<!-- ─── メイン ─── -->
<div id="main-screen">
  <div class="topbar">
    <span class="top-brand">テキーラ道場オンライン</span>
    <a href="/" class="top-home-btn">🏠 TOP</a>
    <button class="top-logout" onclick="doLogout()">ログアウト</button>
  </div>

  <div class="container">
    <!-- ページタイトル -->
    <div style="padding:4px 0 16px;border-bottom:2px solid var(--border2);margin-bottom:16px;display:flex;align-items:baseline;gap:10px">
      <span style="font-size:20px;font-weight:700;color:var(--ink);letter-spacing:.04em">会員マイページ</span>

    </div>

    <!-- 未読ニュースのお知らせ -->
    <a id="unread-news-banner" href="/news.html" style="display:none;margin-bottom:16px;padding:12px 16px;background:#fff4f2;border:1.5px solid #e8130a;border-radius:10px;text-decoration:none;color:#b0180a;font-weight:700;font-size:14px;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(232,19,10,.12);">
      <span style="font-size:18px;flex-shrink:0;">📰</span>
      <span id="unread-news-text"></span>
      <span style="margin-left:auto;font-size:13px;color:#e8130a;white-space:nowrap;">ニュースを見る →</span>
    </a>
    <!-- 公開中イベントのバナー -->
    <div id="event-banners"></div>
    <!-- プロフィールバー -->
    <div class="profile-bar" id="profile-bar">
      <div class="profile-avatar" id="prof-avatar">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" id="prof-avatar-svg">
          <circle cx="16" cy="11" r="6" fill="rgba(255,255,255,.8)"/>
          <ellipse cx="16" cy="26" rx="10" ry="7" fill="rgba(255,255,255,.8)"/>
        </svg>
      </div>
      <div class="profile-name-area">
        <!-- 上段：ID＋会員区分バッジ＋認証再送 -->
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="profile-id" id="prof-id"></div>
          <span id="prof-mem-badge" class="mem-badge mb-active">本会員</span>
          <button id="btn-resend-verify" class="btn-resend" style="display:none" onclick="resendVerifyEmail()">📧 認証メール再送</button>
        </div>
        <!-- 中段：名前 -->
        <div class="profile-name" id="prof-name">—</div>
        <!-- 下段：CLASSバッジ＋段位＋編集ボタン -->
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;">
          <div id="prof-class-badge" class="class-badge class-blanco" onclick="showClassInfo()" title="タップで説明">ブランコ</div>
          <button onclick="showClassInfo()" style="width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);background:none;color:var(--ink3);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;flex-shrink:0;" title="来場クラスとは">?</button>
          <div class="profile-stat-lbl" id="prof-class-lbl"></div>
          <div class="rank-badge" id="prof-rank"></div>
          <a href="/profile_edit.html" style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:11px;color:var(--gold-d);text-decoration:none;white-space:nowrap;margin-left:auto;">✏️ プロフィール編集</a>
        </div>
      </div>
    </div>


    <!-- データ確認バナー -->
    <div class="debug-banner" id="debug-banner"></div>

    <!-- サマリー -->
    <div class="summary-bar" id="summary-bar">
      <div class="sum-chip"><strong id="s-visits">—</strong>来場</div>
      <div class="sum-chip"><strong id="s-bottles">—</strong>試飲ボトル</div>
      <div class="sum-chip"><strong id="s-tequila">—</strong>テキーラml</div>
      <div class="sum-chip"><strong id="s-blind">—</strong>ブラインド</div>
    </div>

    <!-- 達成リストリンク -->
    <div style="margin-bottom:16px;">
      <a id="tasting-log-link" href="/tastinglog.html" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,#0d3d2e,#1a6640);border-radius:10px;text-decoration:none;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);">
        <div>
          <div style="font-size:14px;font-weight:700;letter-spacing:.05em;">🥃 試飲達成リスト</div>
          <div style="font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;">定番品のどれを飲んだか確認できます</div>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(yymmdd){
  // "260521" → "2026年5月21日"
  if(!yymmdd||yymmdd.length<6)return yymmdd||'';
  const y=2000+parseInt(yymmdd.slice(0,2));
  const m=parseInt(yymmdd.slice(2,4));
  const d=parseInt(yymmdd.slice(4,6));
  return `${y}年${m}月${d}日`;
}
function fmtDateFull(yymmdd){
  if(!yymmdd||yymmdd.length<6)return yymmdd||'';
  const y=2000+parseInt(yymmdd.slice(0,2));
  const m=parseInt(yymmdd.slice(2,4));
  const d=parseInt(yymmdd.slice(4,6));
  const dow=['日','月','火','水','木','金','土'];
  const date=new Date(y,m-1,d);
  return `${y}年${m}月${d}日（${dow[date.getDay()]}）`;
}
function fmtTime(hhmm){
  if(!hhmm)return '';
  if(typeof AuthRole!=='undefined'&&AuthRole.formatBusinessTime){
    return AuthRole.formatBusinessTime(hhmm)||hhmm.slice(0,2)+':'+hhmm.slice(2,4);
  }
  return hhmm.slice(0,2)+':'+hhmm.slice(2,4);
}
function fmtAmt(n){return n!=null?'¥'+Number(n).toLocaleString():'—';}
function calcOrderAmt(o){
  if(o.served===0)return 0;
  const mult=o.isGiftPayer?(o.giftCount||0):1;
  if(o.productType==='tequila'||o.productType==='other')return Math.round((o.unitPrice*o.qty)/10)*mult;
  return (o.unitPrice||0)*(o.qty||1)*mult;
}
function markDisplay(markId){
  if(!markId)return '';
  const m=blindMarkMap[markId];
  return m?m.emoji:(markId||'');
}

async function doLogin(){
  const raw=(document.getElementById('l-id').value||'').trim();
  const pw=document.getElementById('l-pw').value;
  const btn=document.getElementById('l-btn');
  const err=document.getElementById('l-err');
  if(!raw||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='ログイン中...';err.textContent='';
  try{
    if(!raw.includes('@')){
      // 会員IDログイン: ID→メール解決とパスワード検証はサーバー側で実施
      // （メールアドレスを端末に渡さないことで列挙を防ぐ）
      const res=await fbFunctions.httpsCallable('loginWithMemberId')({memberId:raw,password:pw});
      await auth.signInWithCustomToken(res.data.token);
    }else{
      await auth.signInWithEmailAndPassword(raw,pw);
    }
    // onAuthStateChangedが以降を処理
  }catch(e){
    let msg='ログインできませんでした';
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ||e.code==='functions/unauthenticated'||e.code==='functions/invalid-argument')msg='IDまたはパスワードが正しくありません';
    else if(e.code==='auth/too-many-requests'||e.code==='functions/resource-exhausted')msg='しばらく時間をおいてお試しください';
    err.textContent=msg;
    btn.disabled=false;btn.textContent='ログイン';
  }
}

// ─── 未読ニュース件数のバナー表示 ───
async function loadUnreadNewsBanner(user){
  try{
    if(!user || user.isAnonymous || typeof NewsRead==='undefined') return;
    const nowIso=new Date().toISOString();
    const reads=await NewsRead.load(db, user.uid);
    const snap=await db.collection('news').get();
    const rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()))
      .filter(r=>{
        if(!r.published) return false;
        if(r.publishStart && r.publishStart>nowIso) return false;
        if(r.publishEnd && r.publishEnd<nowIso) return false;
        return true;
      });
    const n=NewsRead.countUnread(rows, reads);
    const banner=document.getElementById('unread-news-banner');
    const txt=document.getElementById('unread-news-text');
    if(banner && txt && n>0){
      txt.textContent='未読のニュースが'+n+'件あります';
      banner.style.display='flex';
    } else if(banner){
      banner.style.display='none';
    }
  }catch(e){ console.warn('unread news banner error:',e); }
}

// ─── 公開中イベントのバナー ───
async function loadEventBanners(){
  try{
    const box=document.getElementById('event-banners'); if(!box) return;
    const snap=await db.collection('events').where('published','==',true).get();
    const evs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    // 開始日が新しい順
    evs.sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));
    if(!evs.length){ box.innerHTML=''; return; }
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const fmt=s=>{ if(!s)return ''; const p=String(s).split('-'); return p.length===3?(p[0]+'/'+p[1]+'/'+p[2]):s; };
    box.innerHTML=evs.map(ev=>{
      const url=(ev.topPageUrl&&ev.topPageUrl.trim())?ev.topPageUrl.trim():('/event.html?id='+encodeURIComponent(ev.id));
      const period=fmt(ev.startDate)+(ev.endDate&&ev.endDate!==ev.startDate?(' 〜 '+fmt(ev.endDate)):'');
      return `<a href="${esc(url)}" style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:14px 16px;background:linear-gradient(135deg,#fdf3dc,#f4e8cf);border:1.5px solid var(--border2);border-radius:12px;text-decoration:none;color:var(--gold-d);box-shadow:0 2px 10px rgba(200,146,30,.12)">
        <span style="font-size:22px;flex-shrink:0">🎪</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-weight:700;font-size:15px;line-height:1.3">${esc(ev.name||'イベント')}</span>
          <span style="display:block;font-size:12px;color:var(--ink2);margin-top:2px">📅 ${esc(period)}${ev.location?'　📍 '+esc(ev.location):''}</span>
        </span>
        <span style="font-size:13px;white-space:nowrap;flex-shrink:0">詳細 →</span>
      </a>`;
    }).join('');
  }catch(e){ console.warn('event banners error:',e); }
}

// ─── マイページ初期化 ───
async function initMyPage(user){
  document.getElementById('visit-list').innerHTML='<div class="loading">データを読み込み中...</div>';
  // 管理者プレビューモード: ?preview=REALID
  const _previewId=new URLSearchParams(window.location.search).get('preview');
  let _previewMemberDoc=null, _previewMemberId=null;
  if(_previewId){
    try{
      const _tok=await user.getIdTokenResult();
      const _role=_tok.claims.role||'';
      if(_role==='owner'||_role==='staff'){
        const _pSnap=await db.collection('members').doc(_previewId).get();
        if(_pSnap.exists){
          _previewMemberDoc={id:_pSnap.id,..._pSnap.data()};
          _previewMemberId=_previewMemberDoc.memberId||_previewMemberDoc.displayId||_previewMemberDoc.id;
          _mpPreviewId=_pSnap.id;  // getMemberActivity/loadVisitStatus はdocID(realId)で解決する
          const _pBanner=document.createElement('div');
          _pBanner.style.cssText='position:sticky;top:0;z-index:1000;background:#1a3a6e;color:#fff;font-size:12px;padding:6px 10px;letter-spacing:.04em;display:flex;align-items:center;gap:10px';
          const _pBack=document.createElement('button');
          _pBack.type='button';
          _pBack.textContent='← 戻る';
          _pBack.style.cssText='background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer;flex-shrink:0';
          _pBack.addEventListener('click',previewGoBack);
          const _pLabel=document.createElement('span');
          _pLabel.style.cssText='flex:1;text-align:center';
          _pLabel.textContent='管理者プレビュー: '+(_previewMemberDoc.nickname||_previewMemberDoc.name||_previewId)+' ('+_previewId+')';
          _pBanner.appendChild(_pBack);
          _pBanner.appendChild(_pLabel);
          document.body.prepend(_pBanner);
          // 試飲達成リストのリンクにプレビューIDを付与
          var _tlLink=document.getElementById('tasting-log-link');
          if(_tlLink) _tlLink.href='/tastinglog.html?preview='+encodeURIComponent(_previewId);
          // 蒸留所マップリンクにプレビューIDを付与
          var _mapLink=document.getElementById('member-map-link');
          if(_mapLink) _mapLink.href='/tequila_map.html?preview='+encodeURIComponent(_previewId);
        }
      }
    }catch(e){console.warn('preview mode error:',e);}
  }
  try{
    // 1. 会員情報取得（Auth UIDからmembersを検索）
    // Auth emailからmemberIdを取得
    const authEmail=user.email||'';
    let memberId=null;
    if(authEmail.endsWith('@tequiladojo.member')){
      // 仮想メール → 会員ID直接取得
      memberId=authEmail.replace('@tequiladojo.member','');
    } else if(authEmail){
      // 実メール → authUidでmembersを直接検索（自分のドキュメントのみ読めるルールに適合）
      try{
        const uidSnap=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
        if(!uidSnap.empty) memberId=uidSnap.docs[0].id;
      }catch(e){console.warn('authUid lookup error:',e);}
      // fallback: memberIndexから逆引き（一括検索はスタッフのみ許可のため一般会員では失敗し得る）
      if(!memberId){
        try{
          const idxSnap=await db.collection('memberIndex').where('email','==',authEmail).limit(1).get();
          if(!idxSnap.empty) memberId=idxSnap.docs[0].id;
        }catch(e){console.warn('memberIndex lookup error:',e);}
      }
    }

    // membersコレクションから取得
    let memberDoc=null;
    if(memberId){
      const snap=await db.collection('members').doc(memberId).get();
      if(snap.exists)memberDoc={id:snap.id,...snap.data()};
    }
    // fallback: authUidで検索
    if(!memberDoc){
      const snap=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
      if(!snap.empty){
        memberDoc={id:snap.docs[0].id,...snap.docs[0].data()};
        memberId=memberDoc.memberId||snap.docs[0].id;
      }
    }
    // fallback2: emailで検索（所有を証明できないクエリのため一般会員では失敗し得る）
    if(!memberDoc && authEmail && !authEmail.endsWith('@tequiladojo.member')){
      try{
        const snap=await db.collection('members').where('email','==',authEmail).limit(1).get();
        if(!snap.empty){
          memberDoc={id:snap.docs[0].id,...snap.docs[0].data()};
          memberId=memberDoc.memberId||snap.docs[0].id;
        }
      }catch(e){console.warn('email lookup error:',e);}
    }
    // 自分のページ: emailVerified済みなのにpending → activeに自動修正
    if(!_previewMemberDoc && memberDoc && memberDoc.status==='pending' && user.emailVerified){
      try{
        await db.collection('members').doc(memberDoc.id).update({status:'active'});
        memberDoc.status='active';
      }catch(e){console.warn('status auto-fix error:',e);}
    }
    if(_previewMemberDoc){ memberDoc=_previewMemberDoc; memberId=_previewMemberId; }
    // 管理者プレビュー: pendingメンバーは自動的にactiveに修正
    if(_previewMemberDoc && _previewMemberDoc.status==='pending'){
      try{
        await db.collection('members').doc(_previewId).update({status:'active'});
        _previewMemberDoc.status='active';
        memberDoc.status='active';
        const _pFixNote=document.createElement('div');
        _pFixNote.style.cssText='background:#1a5e3a;color:#fff;font-size:11px;text-align:center;padding:4px';
        _pFixNote.textContent='✓ ステータスを認証待ち→本会員に自動修正しました';
        document.body.prepend(_pFixNote);
      }catch(e){
        console.warn('preview status auto-fix error:',e);
        const _pFixBtn=document.createElement('div');
        _pFixBtn.style.cssText='background:#7a1a1a;color:#fff;font-size:11px;text-align:center;padding:4px;cursor:pointer';
        _pFixBtn.innerHTML='⚠ ステータス: 認証待ち &nbsp;<button onclick="(async()=>{await db.collection(\'members\').doc(\''+_previewId+'\').update({status:\'active\'});location.reload();})()" style="font-size:11px;padding:2px 8px;cursor:pointer">→ 本会員に修正</button>';
        document.body.prepend(_pFixBtn);
      }
    }
    currentMember=memberDoc;

    // 2. 表示名・プロフィール設定
    const name=(memberDoc&&(memberDoc.nickname||memberDoc.name))||(memberId&&memberId!=='会員'?memberId:'—');
    const initChar=name?name.charAt(0).toUpperCase():'?';
    // アバター：iconUrlがあれば画像、なければSVGシルエットのまま
    if(memberDoc?.iconUrl){
      const av=document.getElementById('prof-avatar');
      av.innerHTML='<img src="'+memberDoc.iconUrl+'" alt="avatar">';
    }
    document.getElementById('prof-name').textContent=name;
    const displayMemberId=memberDoc?.displayId||memberDoc?.memberId||memberId||'';    document.getElementById('prof-id').textContent=displayMemberId?`ID: ${displayMemberId}`:'';
    var _tul=document.getElementById('top-user-label'); if(_tul) _tul.textContent=name;
    // CLASSバッジ更新
    updateClassBadge(memberDoc?.visitCount||0);
    // 段位表示
    const rankEl=document.getElementById('prof-rank');
    if(rankEl) rankEl.textContent=memberDoc?.rank?memberDoc.rank+'段':'';
    // 会員区分バッジ
    updateMemBadge(memberDoc);

    // デポジット（前払金）: 有効会員のみ残高＋履歴を表示
    renderDepositSection(memberDoc, _previewMemberId);

    // 3. ブラインドマーク取得
    await loadBlindMarks();

    // 4. 来場・注文データ取得
    // 定番品総数：bottlesコレクションのproduction==='0'かつservingStatus!==1
    try{
      const bSnap=await db.collection('bottles').where('production','==','0').get();
      allProducts=bSnap.docs.map(d=>({id:d.id,...d.data()}))
        .filter(p=>p.servingStatus!==1&&p.servingStatus!=='1');
    }catch(e){ allProducts=[]; }
    loadVisitStatus(memberDoc?.id||memberId);  // non-blocking
    await loadMyData(memberDoc?.id||memberId);  // doc ID（realId）でクエリ

    // 5. フィルター初期化
    initFilters();
    applyFilter();

  }catch(e){
    console.error(e);
    document.getElementById('visit-list').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>データの読み込みに失敗しました<br><small>${esc(e.message)}</small></div>`;
  }
}

function _yenMP(n){ return '¥'+(Number(n)||0).toLocaleString(); }
function _fmtDMP(s){ return s&&s.length===6?('20'+s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4,6)):(s||''); }
function _fmtTMP(s){ return s&&s.length>=4?(s.slice(0,2)+':'+s.slice(2,4)):(s||''); }
async function renderDepositSection(memberDoc, previewMemberId){
  var sec=document.getElementById('deposit-section');
  if(!sec) return;
  var enabled=memberDoc&&(memberDoc.depositEnabled===1||memberDoc.depositEnabled==='1'||memberDoc.depositEnabled===true);
  if(!enabled){ sec.style.display='none'; return; }
  sec.style.display='block';
  document.getElementById('deposit-balance').textContent=_yenMP(memberDoc.depositBalance||0);
  var histEl=document.getElementById('deposit-hist');
  histEl.innerHTML='<div class="loading" style="padding:16px">読み込み中...</div>';
  try{
    var req=previewMemberId?{previewMemberId:previewMemberId}:{};
    var res=await fbFunctions.httpsCallable('getMyDepositHistory')(req);
    var d=res.data||{};
    if(typeof d.balance==='number') document.getElementById('deposit-balance').textContent=_yenMP(d.balance);
    var items=d.items||[];
    if(!items.length){ histEl.innerHTML='<div class="empty" style="padding:20px;text-align:center;color:#9a8470;font-size:13px">履歴はありません</div>'; return; }
    histEl.innerHTML=items.map(function(r){
      var plus=(Number(r.amount)||0)>=0;
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(160,130,100,.12)">'
        +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:600">'+(plus?'入金（追加）':'支払・払戻')+(r.source==='checkout'?'　<span style="font-size:10px;color:#9a8470">会計</span>':'')+'</div>'
          +'<div style="font-size:11px;color:#9a8470">'+esc(_fmtDMP(r.date))+' '+esc(_fmtTMP(r.time))+'</div>'
        +'</div>'
        +'<div style="font-family:monospace;font-weight:700;font-size:14px;color:'+(plus?'#1a6640':'#b03020')+'">'+(plus?'+':'')+_yenMP(r.amount)+'</div>'
      +'</div>';
    }).join('');
  }catch(e){
    histEl.innerHTML='<div class="empty" style="padding:16px;text-align:center;color:#9a8470;font-size:12px">履歴を取得できませんでした<br><span style="font-size:10px">'+esc(e.message||'')+'</span></div>';
  }
}

// visits/orders はセキュリティルール上スタッフ限定読み取りのため、
// Cloud Functions（getMemberActivity）経由で本人分のみ取得する（1回だけ実行して共有）
let _activityPromise=null;
function fetchActivity(memberId){
  if(!_activityPromise){
    // 管理者プレビュー時は対象会員のdocIDをサーバーへ渡す（未指定だとログイン中スタッフ本人の履歴が返る）
    const req=_mpPreviewId?{previewMemberId:_mpPreviewId}:{};
    _activityPromise=fbFunctions.httpsCallable('getMemberActivity')(req).then(r=>r.data||{});
  }
  return _activityPromise;
}

async function loadMyData(memberId){
  const issues=[];
  console.log('[loadMyData] called with memberId:', memberId, typeof memberId);

  // productsはinitMyPageで取得済み

  let act;
  try{
    act=await fetchActivity(memberId);
  }catch(e){
    console.error('getMemberActivity error:',e);
    document.getElementById('visit-list').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>来場履歴の取得に失敗しました<br><span style="font-size:11px">'+(e.message||'')+'</span></div>';
    updateSummary([]);
    showDebugBanner(['来場データ取得エラー: '+(e.message||'')]);
    return;
  }

  allVisits=(act.visits||[]).slice();

  // visitDateがない古いデータのチェック
  const noDate=allVisits.filter(v=>!v.visitDate&&!v.visitTime);
  if(noDate.length>0){
    issues.push(`${noDate.length}件の来場データに日時情報がありません（旧データ）`);
  }

  if(!allVisits.length){
    document.getElementById('visit-list').innerHTML='<div class="empty"><div class="empty-icon">🥃</div>来場履歴がありません</div>';
    updateSummary([]);
    showDebugBanner(issues);
    return;
  }

  // 来場日でソート（visitDateがない場合はIDから推定）
  allVisits.sort((a,b)=>{
    // 営業日付+営業時刻でソート（降順）
    const da=(a.visitDate||a.id.slice(0,6)||'')+(a.visitTime||'');
    const db2=(b.visitDate||b.id.slice(0,6)||'')+(b.visitTime||'');
    return db2.localeCompare(da);
  });

  // orders / blindResults / 同席情報はサーバー（getMemberActivity）が本人分をまとめて返す
  allOrders=(act.orders||[]).slice();

  // ordersにvisitKeyがあるか確認
  const ordersNoVisit=allOrders.filter(o=>!o.visitKey&&!o.visitId);
  if(ordersNoVisit.length>0){
    issues.push(`${ordersNoVisit.length}件の注文データにvisitKeyがありません`);
  }

  allBlindResults=(act.blindResults||[]).slice();
  allBatchOrders=(act.batchOrders||[]).slice(); // 同席者（結果テーブルの参加者行）
  setupBlindFlightWatchers(); // 店側の「入力許可」フラグをリアルタイム監視（許可されるまで入力ボタン非表示）

  // 会員名・visitKey→memberIdのキャッシュ（サーバーが解決済み）
  Object.keys(act.memberNames||{}).forEach(mid=>{
    if(!allMembersMap[mid]) allMembersMap[mid]={nickname:act.memberNames[mid]};
  });
  Object.keys(act.visitMemberMap||{}).forEach(vk=>{
    const mid=act.visitMemberMap[vk];
    allMembersMap['visit_'+vk]=mid;
    if(mid&&!allMembersMap[mid]) allMembersMap[mid]={nickname:mid};
  });

  // _togetherMap構築
  const myMidFinal=currentMember?.memberId||currentMember?.id;
  const batchToOtherNames={};

  // まずblindResultsから補完
  allBlindResults.forEach(r=>{
    if(!r.batchId||r.customerId===myMidFinal)return;
    const mid=r.customerId;
    const info=mid?allMembersMap[mid]:null;
    const name=info?info.nickname:null;
    if(!name)return;
    if(!batchToOtherNames[r.batchId])batchToOtherNames[r.batchId]=[];
    if(!batchToOtherNames[r.batchId].includes(name))batchToOtherNames[r.batchId].push(name);
  });

  // 同一バッチ内の他会員の注文（サーバーがvisitKey/batchIdに縮約済み）
  (act.batchOrders||[]).forEach(b=>{
    const mid=allMembersMap['visit_'+b.visitKey];
    const info=mid?allMembersMap[mid]:null;
    const name=info?info.nickname:null;
    if(!name||mid===myMidFinal)return;
    if(!batchToOtherNames[b.batchId])batchToOtherNames[b.batchId]=[];
    if(!batchToOtherNames[b.batchId].includes(name))batchToOtherNames[b.batchId].push(name);
  });
  window._togetherMap=batchToOtherNames;

  showDebugBanner(issues);
}

function showDebugBanner(issues){
  const el=document.getElementById('debug-banner');
  if(issues.length){
    el.textContent='⚠️ データ確認: '+issues.join(' / ');
    el.classList.add('show');
  }else{
    el.classList.remove('show');
  }
}

// ─── フィルター ───
function initFilters(){
  const years=new Set();
  allVisits.forEach(v=>{
    const date=v.visitDate||v.id.slice(0,6)||'';
    if(date.length>=2)years.add('20'+date.slice(0,2));
  });
  const sel=document.getElementById('f-year');
  sel.innerHTML='<option value="">すべての年</option>';
  [...years].sort((a,b)=>b-a).forEach(y=>{
    sel.innerHTML+=`<option value="${y}">${y}年</option>`;
  });
}

function applyFilter(){
  const year=document.getElementById('f-year').value;
  const from=document.getElementById('f-from').value; // YYYY-MM-DD
  const to=document.getElementById('f-to').value;

  filteredVisits=allVisits.filter(v=>{
    const dateStr=v.visitDate||v.id.slice(0,6)||'';
    // YYMMDD → YYYY-MM-DD
    const iso=dateStr.length===6?`20${dateStr.slice(0,2)}-${dateStr.slice(2,4)}-${dateStr.slice(4,6)}`:'';
    if(year&&!iso.startsWith(year))return false;
    if(from&&iso<from)return false;
    if(to&&iso>to)return false;
    return true;
  });

  updateSummary(filteredVisits);
  renderVisitList(filteredVisits);
}

function resetFilter(){
  document.getElementById('f-year').value='';
  document.getElementById('f-from').value='';
  document.getElementById('f-to').value='';
  applyFilter();
}

// 会員区分バッジ更新
function updateMemBadge(doc){
  const badge=document.getElementById('prof-mem-badge');
  const resendBtn=document.getElementById('btn-resend-verify');
  if(!badge) return;
  if(resendBtn) resendBtn.style.display='none';
  // statusが未設定の場合はisGuest/isTempフラグで判断
  const st=doc?.status||null;
  const isGuest=doc?.isGuest===true;
  const isTemp=doc?.isTemp===true;
  if(st==='active' || (!st && !isGuest && !isTemp)){
    // statusがactiveまたは未設定かつフラグなし→本会員
    badge.textContent='本会員'; badge.className='mem-badge mb-active';
  } else if(st==='pending'){
    badge.textContent='認証待ち'; badge.className='mem-badge mb-pending';
    if(resendBtn) resendBtn.style.display='inline-block';
  } else if(st==='temp'||isTemp){
    badge.textContent='仮登録'; badge.className='mem-badge mb-temp';
  } else if(isGuest||st==='guest'){
    badge.textContent='ゲスト'; badge.className='mem-badge mb-guest';
  } else {
    badge.textContent='本会員'; badge.className='mem-badge mb-active';
  }
}

async function updateSummary(visits){
  const vIds=new Set(visits.map(v=>v.id));
  const orders=allOrders.filter(o=>vIds.has(o.visitKey||o.visitId));
  const totalAmt=orders.reduce((s,o)=>s+calcOrderAmt(o),0);
  const totalTq=orders.filter(o=>o.productType==='tequila'||o.productType==='other')
    .reduce((s,o)=>o.served!==0?s+(o.qty||0):s,0);
  const blindCount=allBlindResults.filter(r=>vIds.has(r.visitKey)).length;

  // 試飲ボトル数（tastinglogと同じくbottleData→bottleIdのIDベース照合）
  const allVIds=new Set(allVisits.map(v=>v.id));
  const allOrdersForMember=allOrders.filter(o=>allVIds.has(o.visitKey||o.visitId));
  const bdIds=new Set();
  allOrdersForMember.forEach(o=>{
    if(o.productType==='tequila'||o.productType==='other'){
      const id=o.productCode||o.productId; if(id) bdIds.add(id);
    }else if(o.productType==='cocktail'&&o.baseProductCode){
      // カクテルはベースのお酒を試飲ボトルに含める
      bdIds.add(o.baseProductCode);
    }
  });
  const drunkBottleIds=new Set();
  if(bdIds.size>0){
    const bdArr=[...bdIds];
    for(let bi=0;bi<bdArr.length;bi+=10){
      try{
        const bdSnap=await db.collection('bottleData')
          .where(firebase.firestore.FieldPath.documentId(),'in',bdArr.slice(bi,bi+10)).get();
        bdSnap.forEach(d=>{if(d.data().bottleId) drunkBottleIds.add(d.data().bottleId);});
      }catch(e){}
    }
  }
  const drunkRegular=allProducts.filter(p=>drunkBottleIds.has(p.id)).length;
  const totalRegular=allProducts.length;
  document.getElementById('s-bottles').textContent=totalRegular>0
    ? drunkRegular+'('+totalRegular+')'
    : drunkBottleIds.size+'(?)';

  document.getElementById('s-visits').textContent=visits.length;
  document.getElementById('s-tequila').textContent=totalTq+'ml';
  document.getElementById('s-blind').textContent=blindCount+'回';
  document.getElementById('list-count').textContent=visits.length+'件';
}

// ─── 来場リスト描画 ───
function renderVisitList(visits){
  const el=document.getElementById('visit-list');
  if(!visits.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">🔍</div>該当する来場記録がありません</div>';
    return;
  }
  el.innerHTML=visits.map(v=>buildVisitCard(v)).join('');
}

function buildVisitCard(v){
  const dateStr=v.visitDate||v.id.slice(0,6)||'';
  const dateLabel=fmtDateFull(dateStr);
  const checkinTime=v.visitTime?fmtTime(v.visitTime):'';
  const checkoutTime=v.checkoutTime?'〜'+fmtTime(v.checkoutTime):'';

  // この来場の注文（全件）
  const orders=allOrders.filter(o=>(o.visitKey===v.id||o.visitId===v.id));
  const servedOrders=orders.filter(o=>o.served!==0&&o.served!=='0'); // 金額・ml集計はキャンセル除く
  const totalAmt=servedOrders.reduce((s,o)=>s+calcOrderAmt(o),0);
  // 奢りの支払注文(isGiftPayer)は本人の飲酒ではないので飲酒量に数えない（本人分は isGiftSelf の0円注文で計上）
  const totalTq=servedOrders.filter(o=>(o.productType==='tequila'||o.productType==='other')&&!o.isGiftPayer).reduce((s,o)=>s+(o.qty||0),0);
  const hasBlind=orders.some(o=>o.blindId===1);
  const itemCount=servedOrders.length;

  return`<div class="visit-card" id="vc-${esc(v.id)}" onclick="toggleVisitCard('${esc(v.id)}')">
    <div class="visit-header">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="visit-date">${esc(dateLabel)}</span>
          <div class="visit-badges">
            ${itemCount?`<span class="badge badge-items">${itemCount}品</span>`:''}
          </div>
        </div>
        <div style="margin-top:3px;display:flex;gap:8px;align-items:center">
          <span class="visit-time">${esc(checkinTime)}${checkoutTime?'　'+checkoutTime:''}</span>
        </div>
      </div>
      <div>
        <div class="visit-amount">${fmtAmt(totalAmt)}</div>
        ${totalTq?`<div class="visit-tequila">${totalTq}ml</div>`:''}
      </div>
      <span class="visit-chevron">▼</span>
    </div>
    <div class="visit-detail" id="vd-${esc(v.id)}">
      ${buildOrderDetail(v.id)}
    </div>
  </div>`;
}

function toggleVisitCard(vid){
  const card=document.getElementById('vc-'+vid);
  if(!card)return;
  card.classList.toggle('open');
}

// ─── 注文詳細パネル ───
function buildOrderDetail(visitId){
  const orders=allOrders.filter(o=>(o.visitKey===visitId||o.visitId===visitId));
  if(!orders.length)return'<div class="empty" style="padding:20px">注文記録がありません</div>';

  // orderGroupIdでグループ化
  const gmap={};
  orders.forEach(o=>{
    const gid=o.orderGroupId||('solo_'+o.id);
    if(!gmap[gid])gmap[gid]=[];
    gmap[gid].push(o);
  });

  // batchIdでさらに束ねて時系列ソート
  const bmap={};
  Object.entries(gmap).forEach(([gid,items])=>{
    const sample=items[0];
    const bid=sample.batchId||('b_'+gid);
    if(!bmap[bid])bmap[bid]={bid,gid,batchId:sample.batchId||null,orderTime:sample.orderTime||'',groups:[],items:[]};
    bmap[bid].groups.push(gid);
    bmap[bid].items.push(...items);
    // 同じbatchの最初のgidを代表に
    if(!bmap[bid].repGid)bmap[bid].repGid=gid;
  });

  const batches=Object.values(bmap).sort((a,b)=>(a.orderTime||'').localeCompare(b.orderTime||''));

  return batches.map(b=>buildBatchBlock(b,visitId)).join('');
}

function buildBatchBlock(b,visitId){
  const time=b.orderTime?fmtTime(b.orderTime):'';
  const items=b.items;
  const isBlind=items.some(o=>o.blindId===1);

  // 同時注文の場合：一緒に注文した別の来場者名を取得
  let togetherLabel='';
  if(b.batchId){
    // batchId共通のordersで別visitKeyのものを探す
    const batchOrders=allOrders.filter(o=>o.batchId===b.batchId&&(o.visitKey!==visitId&&o.visitId!==visitId));
    const otherVisitKeys=[...new Set(batchOrders.map(o=>o.visitKey||o.visitId).filter(Boolean))];
  }
  // _togetherMapから名前を取得（loadMyData完了後に構築済み・if文の外）
  const togetherNames2=(window._togetherMap||{})[b.batchId||b.groups[0]]||[];
  if(togetherNames2.length) togetherLabel=`👥 ${togetherNames2.join('、')}と一緒`;

  // この注文グループのブラインド結果
  // blindResultをbatchIdベースで全員分取得
  const myMid=currentMember?.memberId||currentMember?.id;
  const blindResults4group=b.batchId
    ? allBlindResults.filter(r=>r.batchId===b.batchId)
    : allBlindResults.filter(r=>b.groups.some(g=>r.groupId===g||r.id===g));
  const blindResult=isBlind?(blindResults4group.find(r=>r.customerId===myMid)||blindResults4group[0]):null;

  // 注文アイテム（重複除去：batchで同じ商品が複数人分あるので代表1件）
  // batchの場合は代表グループ（最初のgid）の商品のみ表示
  const repGid=b.repGid||b.groups[0];
  const repItems=items.filter(o=>(o.orderGroupId===repGid||(b.groups.length===1))&&o.served!==0&&o.served!=='0');
  const total=repItems.reduce((s,o)=>s+calcOrderAmt(o),0);

  const itemsHtml=repItems.map(o=>{
    const isUnserved=(o.served===1||o.served==='1');
    const amt=isUnserved?0:calcOrderAmt(o);
    return`<div class="og-item${isUnserved?' og-item-cancelled':''}">      <span class="og-item-name">${esc(o.productName)}</span>      <span class="og-item-qty">${o.qty}${o.unit||''}</span>      ${isUnserved?'<span class="og-item-cancelled-badge" style="background:var(--cream3);color:var(--ink3)">未提供</span>':`<span class="og-item-price">${fmtAmt(amt)}</span>`}    </div>`;
  }).join('');

  const allCorrect=blindResults4group.reduce((s,r)=>s+(r.correctCount||0),0);
  const allTotal=blindResults4group.reduce((s,r)=>s+(r.totalCount||0),0);
  const blindSummary=blindResults4group.length?`${allCorrect}/${allTotal}正解`:'';

  // ブラインドリンク
  // 店側が「ユーザー入力を許可」するまで（blindFlights.inputOpen）結果入力ボタンは出さない
  const _inputAllowed=!!((blindFlightMap[b.batchId]||{}).inputOpen);
  const blindInputBtn=(isBlind&&b.batchId&&_inputAllowed)
    ?`<span class="og-badge" style="background:#e7f0ff;color:#0c447c;cursor:pointer;font-size:11px" onclick="event.stopPropagation();openBlindInput('${esc(b.batchId)}','${esc(visitId)}','${esc(b.repGid||b.groups[0])}')" title="ブラインドの結果を入力">🎭 結果入力</span>`
    :'';
  const blindLink=isBlind
    ?`<span class="og-badge" style="background:#f3eaff;color:#6b3fa0;cursor:pointer;font-size:11px" onclick="event.stopPropagation();openBlindView('${esc(b.batchId||'')}','${esc(b.repGid||b.groups[0])}','${esc(visitId)}')" title="ブラインド結果を見る">🎭 結果を表示</span>`
    :'';

  // 一緒に飲んだ人：「N人と一緒」クリックでポップアップ
  const batchKey=esc(b.batchId||b.groups[0]||'');
  const togetherChip=togetherNames2.length
    ?`<span class="og-together" onclick="showTogetherPopup(event,'${batchKey}')">${togetherNames2.length}人と一緒</span>`
    :'';

  // 奢りチップ：本人が奢った側なら🎁＋相手名、奢られた側なら🎁＋奢ってくれた人名
  const payerOrder=b.items.find(o=>o.isGiftPayer&&o.giftTo&&o.giftTo.length);
  const recvOrder=b.items.find(o=>o.isGiftRecipient);
  let giftChip='';
  if(payerOrder){
    giftChip=`<span class="og-badge" style="background:#fdf0d0;color:var(--gold-d);font-size:11px" title="奢った相手">🎁 奢った: ${esc(payerOrder.giftTo.map(r=>r.name).join('、'))}</span>`;
  }else if(recvOrder){
    giftChip=`<span class="og-badge" style="background:#e7f6f1;color:var(--teal);font-size:11px" title="奢ってくれた人">🎁 奢られ${recvOrder.giftFromName?'（'+esc(recvOrder.giftFromName)+'）':''}</span>`;
  }

  return`<div class="order-group">
    <div class="og-header">
      <span class="og-time">${esc(time)}</span>
      ${blindInputBtn}
      ${blindLink}
      ${giftChip}
      ${togetherChip}
      <span class="og-total">${fmtAmt(total)}</span>
    </div>
    <div class="og-items">${itemsHtml}</div>
  </div>`;
}

// ─── 一緒に飲んだ人ポップアップ ───
function showTogetherPopup(e, batchKey){
  e.stopPropagation();
  e.preventDefault();
  // 既存ポップアップを削除
  document.querySelectorAll('.together-popup').forEach(el=>el.remove());
  const names=(window._togetherMap||{})[batchKey]||[];
  if(!names.length)return;
  const popup=document.createElement('div');
  popup.className='together-popup';
  popup.innerHTML=names.map(n=>`<div class="together-popup-name">👤 ${n}</div>`).join('');
  document.body.appendChild(popup);
  // 位置調整（タッチ/クリック両対応）
  const tgt=e.currentTarget||e.target;
  const rect=tgt.getBoundingClientRect();
  popup.style.top=(rect.bottom+4)+'px';
  popup.style.left=Math.min(rect.left, window.innerWidth-210)+'px';
  // タッチ/クリックで閉じる
  setTimeout(()=>{
    function handler(ev){
      if(!popup.contains(ev.target)){popup.remove();}
      document.removeEventListener('click',handler);
      document.removeEventListener('touchend',handler);
    }
    document.addEventListener('click',handler);
    document.addEventListener('touchend',handler);
  },50);
}

// ─── ブラインド結果モーダル（全員分テーブル表示） ───
function openBlindModal(gid, visitId){
  // batchIdベースで全員分取得（同じbatchの全グループ）
  // gidに対応するbatchIdを特定
  const batchIdForGid=allOrders.find(o=>o.orderGroupId===gid)?.batchId;
  const results=batchIdForGid
    ? allBlindResults.filter(r=>r.batchId===batchIdForGid)
    : allBlindResults.filter(r=>r.groupId===gid||r.id===gid);
  const body=document.getElementById('blind-modal-body');
  const nums=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  const MARK_COLOR={R:'#c0392b',G:'#1a6e3a',W:null,Y:'#b8860b',B:'#185FA5'};

  function markColor(markId){
    if(!markId)return'#666';
    const cc=markId.charAt(0);
    return cc==='W'?'#18110a':(MARK_COLOR[cc]||'#666');
  }
  function markSym(markId){
    if(!markId)return'?';
    const isDbl=markId.charAt(1)==='◎';
    const isW=markId.charAt(0)==='W';
    return isW?(isDbl?'○○':'○'):(isDbl?'●●':'●');
  }

  if(!results.length){
    body.innerHTML=`<div class="empty" style="padding:30px 0"><div class="empty-icon">🎭</div>結果未入力</div>`;
    document.getElementById('blind-modal').classList.add('open');
    return;
  }

  // マーク順序を収集
  const marksOrder=[];
  const marksProductMap={};
  results.forEach(r=>{
    (r.answers||[]).forEach(ans=>{
      const mk=ans.blindMarkId||'?';
      if(!marksOrder.includes(mk)){marksOrder.push(mk);marksProductMap[mk]=ans.actualProduct||'—';}
    });
  });

  // 会員名取得
  const myMid2=currentMember?.memberId||currentMember?.id;
  const memberNames=results.map(r=>{
    const mid=r.customerId;
    // 自分かチェック
    if(mid===myMid2)return currentMember?.nickname||currentMember?.name||mid||'—';
    const info=mid?allMembersMap[mid]:null;
    return info?info.nickname:(mid||'—');
  });

  // テーブルヘッダー
  // ウィナーマーク集計（各マークが何人に選ばれたか）
  const winnerCount={};
  results.forEach(r=>{if(r.winner)winnerCount[r.winner]=(winnerCount[r.winner]||0)+1;});

  const thMarks=marksOrder.map((mk,mi)=>{
    const c=markColor(mk); const s=markSym(mk);
    return`<th><div style="font-size:10px;color:var(--ink3)">${nums[mi]}</div><div style="color:${c};font-weight:700;font-size:12px">${s}</div></th>`;
  }).join('');
  const thead=`<thead><tr><th class="name-th">名前</th>${thMarks}<th>好</th><th>正解</th></tr></thead>`;

  // データ行
  const tbody=results.map((r,ri)=>{
    const ansMap={};
    (r.answers||[]).forEach(ans=>{ansMap[ans.blindMarkId||'?']=ans;});
    const cells=marksOrder.map(mk=>{
      const ans=ansMap[mk];
      if(!ans)return'<td>—</td>';
      const c=markColor(ans.guessMarkId||'');
      const s=markSym(ans.guessMarkId||'');
      return`<td class="${ans.isCorrect?'correct':'wrong'}" style="color:${c};font-weight:700">${s}</td>`;
    }).join('');
    // 好きなマーク（winner）をマーク記号で表示
    const winMk=r.winner||'';
    const winC=winMk?markColor(winMk):'#999';
    const winS=winMk?markSym(winMk):'—';
    const winDisp=winMk?`<span style="color:${winC};font-weight:700">${winS}</span>`:'—';
    const sc=`${r.correctCount||0}/${r.totalCount||0}`;
    const scColor=(r.correctCount||0)===(r.totalCount||0)?'var(--teal)':'var(--ink)';
    return`<tr><td class="name-td">${esc(memberNames[ri])}</td>${cells}<td>${winDisp}</td><td class="score-td" style="color:${scColor}">${sc}</td></tr>`;
  }).join('');

  // マーク対応表（ウィナー件数付き）
  const legendRows=marksOrder.map((mk,i)=>{
    const c=markColor(mk);const s=markSym(mk);
    const wc=winnerCount[mk]||0;
    const wcDisp=wc?`<span style="margin-left:auto;font-size:11px;color:var(--gold-d);font-weight:600">好 ${wc}票</span>`:'';
    return`<div class="bpop-legend-row"><span class="bpop-legend-num">${nums[i]}</span><span style="color:${c};font-weight:700;font-size:13px">${s}</span><span style="color:var(--ink2);flex:1">${esc(marksProductMap[mk])}</span>${wcDisp}</div>`;
  }).join('');

  body.innerHTML=`
    <div class="bpop-info">${memberNames.join('・')} | ${marksOrder.length}種 × ${results.length}名</div>
    <div class="bpop-table-wrap"><table class="bpop-table">${thead}<tbody>${tbody}</tbody></table></div>
    <div class="bpop-legend"><div class="bpop-legend-title">マーク対応表</div>${legendRows}</div>`;
  document.getElementById('blind-modal').classList.add('open');
}

// バッチの代表 visitKey / orderGroupId を自分の注文から求める（公開ポップアップ用）
function _biBatchCtx(batchId){
  var o=allOrders.find(function(x){ return x.batchId===batchId && x.blindId===1 && (x.visitKey||x.visitId); });
  if(!o) return null;
  return { visitId:(o.visitKey||o.visitId), repGid:o.orderGroupId||null };
}
// 「結果を表示」: 公開中で未保存ならリアルタイム表を、保存済みなら履歴ビューアを開く。
function openBlindView(batchId, repGid, visitId){
  var fl=blindFlightMap[batchId]||{};
  var hasSaved=allBlindResults.some(function(r){ return r.batchId===batchId; });
  if(fl.revealed && !hasSaved){ openBlindTable(batchId, visitId, repGid); }
  else { openBlindModal(repGid, visitId); }
}
// 店側の「入力許可(inputOpen)」をリアルタイム監視。許可された瞬間に入力ボタンを出す。
// さらに「結果公表(revealed)」された瞬間に結果テーブルをポップアップ表示する。
function setupBlindFlightWatchers(){
  var batchIds=[...new Set(allOrders.filter(function(o){return o.blindId===1 && o.batchId;}).map(function(o){return o.batchId;}))];
  batchIds.forEach(function(bid){
    if(_bfWatchers[bid]) return;
    _bfWatchers[bid]=db.collection('blindFlights').doc(bid).onSnapshot(function(doc){
      var first=!(bid in blindFlightMap);
      var data=doc.exists?(doc.data()||{}):{};
      blindFlightMap[bid]=data;
      if(typeof applyFilter==='function') applyFilter(); // 入力ボタンの表示状態を反映
      // 公開された瞬間（このセッション中の遷移）に結果ポップアップを自動表示
      if(data.revealed){
        if(first){ _biRevealShown[bid]=true; }          // ロード時点で既に公開済み → 自動表示しない（ボタンから閲覧可）
        else if(!_biRevealShown[bid]){
          _biRevealShown[bid]=true;
          var alreadyOpen=(_biState&&_biState.batchId===bid);
          var ctx=_biBatchCtx(bid);
          if(!alreadyOpen && ctx) openBlindTable(bid, ctx.visitId, ctx.repGid);
        }
      }
    }, function(){});
  });
}

// 管理者画面(markSym)と同じ体裁：色付き●/●●（白は○/○○）。数字マークは丸数字。
function biMarkChip(markId){
  var m=blindMarkMap[markId]||{};
  if(m.emoji) return '<span title="'+esc(m.label||'')+'">'+esc(m.emoji)+'</span>'; // 明示的な絵文字設定時のみ
  var id=markId||'';
  var num=parseInt(id,10);
  if(!isNaN(num)&&num>=1&&num<=10&&/^\d+$/.test(id)) return '<span style="color:#4a3820;font-weight:700">'+_biNums[num-1]+'</span>';
  var cc=m.colorCode||id.charAt(0), isDbl=(m.mark||id.charAt(1))==='◎', isW=cc==='W';
  var col=isW?'#18110a':({R:'#c0392b',G:'#1a6e3a',Y:'#b8860b',B:'#185FA5'}[cc]||'#666');

  return '<span style="color:'+col+';font-weight:700;letter-spacing:-1px">'+sym+'</span>';
}

function _biName(customerId, visitKey){
  var info=customerId&&allMembersMap[customerId];
  if(info&&(info.nickname||info.name)) return info.nickname||info.name;
  if(visitKey){ var mid=allMembersMap['visit_'+visitKey]; var i2=mid&&allMembersMap[mid]; if(i2&&(i2.nickname||i2.name)) return i2.nickname||i2.name; }

}
// バッチの参加者行（自分＋同席者）。blindGuesses到着時にさらに補完する。
function _biBuildRows(batchId, myCustomerId, myVisitKey){
  var rowMap={};
  function add(cid, vk, name, isMe){
    if(!cid) return;
    if(!rowMap[cid]) rowMap[cid]={customerId:cid, visitKey:vk||null, name:name||_biName(cid,vk)||cid, isMe:!!isMe, answers:{}, winner:null, confirmed:false};
    else { if(isMe) rowMap[cid].isMe=true; if(name&&(rowMap[cid].name===cid||!rowMap[cid].name)) rowMap[cid].name=name; }
  }
  add(myCustomerId, myVisitKey, (currentMember&&(currentMember.nickname||currentMember.name))||null, true);
  (allBatchOrders||[]).filter(function(bo){return bo.batchId===batchId;}).forEach(function(bo){
    var mid=allMembersMap['visit_'+bo.visitKey]||bo.visitKey;
    add(mid, bo.visitKey, _biName(mid,bo.visitKey), false);
  });
  return rowMap;
}
async function openBlindInput(batchId, visitId, repGid){ return openBlindTable(batchId, visitId, repGid); }
async function openBlindTable(batchId, visitId, repGid){
  ensureBlindInputModal();
  var marks=[...new Set(allOrders.filter(function(o){return o.batchId===batchId && o.blindId===1 && (o.served!==0&&o.served!=='0');}).map(function(o){return o.blindMarkId;}).filter(Boolean))];
  if(!marks.length){ mpToast('ブラインド対象が見つかりません'); return; }
  var myCustomerId=currentMember&&(currentMember.id||currentMember.memberId);
  var authUid=(auth.currentUser&&auth.currentUser.uid)||null;
  var fl=blindFlightMap[batchId]||{};
  _biState={ batchId:batchId, visitId:visitId, repGid:repGid, myCustomerId:myCustomerId, authUid:authUid,
    marks:marks, rowMap:_biBuildRows(batchId, myCustomerId, visitId),
    inputOpen:!!fl.inputOpen, revealed:!!fl.revealed };
  renderBiTable();
  document.getElementById('blind-input-modal').style.display='flex';
  subscribeBiGuesses();
  watchBlindFlight(batchId);
}
function subscribeBiGuesses(){
  var s=_biState; if(!s) return;
  if(_biGuessUnsub){ try{_biGuessUnsub();}catch(e){} }
  _biGuessUnsub=db.collection('blindGuesses').where('batchId','==',s.batchId).onSnapshot(function(snap){
    if(!_biState) return;
    snap.forEach(function(d){
      var g=d.data(); if(!g||!g.customerId) return;
      var r=_biState.rowMap[g.customerId];
      if(!r){ r=_biState.rowMap[g.customerId]={customerId:g.customerId, visitKey:g.visitKey||null, name:(g.name||g.customerId), isMe:(g.customerId===_biState.myCustomerId), answers:{}, winner:null, confirmed:false}; }
      // 自分が編集中の未保存内容を、自分の書き込みechoで上書きしても内容は一致するので安全。
      var na={}; if(Array.isArray(g.answers)) g.answers.forEach(function(a){ na[a.blindMarkId]=a.guessMarkId||null; });
      r.answers=na; r.winner=g.winner||null; r.confirmed=!!g.confirmed;
      if(g.name&&(r.name===g.customerId||!r.name)) r.name=g.name;
    });
    renderBiTable();
  }, function(){});
}
function watchBlindFlight(batchId){
  if(_biFlightUnsub){ try{_biFlightUnsub();}catch(e){} _biFlightUnsub=null; }
  _biFlightUnsub=db.collection('blindFlights').doc(batchId).onSnapshot(function(doc){
    if(!_biState||_biState.batchId!==batchId) return;
    var d=doc.exists?(doc.data()||{}):{};
    _biState.inputOpen=!!d.inputOpen; _biState.revealed=!!d.revealed;
    renderBiTable();
  }, function(){});
}
function _biRow(cid){ return _biState&&_biState.rowMap[cid]; }
function _biMe(){ return _biState&&_biState.rowMap[_biState.myCustomerId]; }
function _biOrder(){
  var s=_biState, ids=Object.keys(s.rowMap);
  ids.sort(function(a,b){ if(a===s.myCustomerId)return -1; if(b===s.myCustomerId)return 1; return String(_biRow(a).name||'').localeCompare(String(_biRow(b).name||'')); });
  return ids;
}
function renderBiTable(){
  var s=_biState; if(!s) return;
  var marks=s.marks, revealed=s.revealed, me=_biMe();
  var editable=!!(me && s.inputOpen && !me.confirmed);   // 自分の行が編集可能か

  var markName={};
  (allOrders||[]).forEach(function(o){ if(o&&o.batchId===s.batchId&&o.blindId===1&&o.blindMarkId&&o.productName&&!markName[o.blindMarkId]) markName[o.blindMarkId]=o.productName; });
  // 選択欄はカラーマークピッカー（管理者画面と同じ：番号＋色付き●/●●＋ラベル）。ボトル名は下の「マーク対応」で表示。

  }).join('');
  var thead='<thead><tr><th style="text-align:left;padding-left:8px">名前</th>'+thMarks+'<th>好</th><th>正解</th></tr></thead>';
  // 行
  var tbody=_biOrder().map(function(cid){
    var r=_biRow(cid), isMe=r.isMe;

      }else{

    }).join('');
    var w=r.winner||'';
    var winCell=canEditRow ? '<button type="button" class="bi-pk'+(w?' has':'')+'" onclick="biOpenWinnerPicker(event,this)">'+(w?biMarkChip(w):'<span class="ph">選択</span>')+'<span class="cr">▾</span></button>' : (w?biMarkChip(w):'<span style="color:#bbb">—</span>');
    var score='—';

    var nm=esc(r.name||r.customerId)+(r.confirmed?' <span style="color:#1a6640;font-size:11px">✅</span>':'');
    return '<tr class="'+(isMe?'me-row':'')+'"><td class="nm">'+nm+'</td>'+cells+'<td class="'+(isMe?'me':'')+'">'+winCell+'</td><td>'+score+'</td></tr>';
  }).join('');
  // 凡例
  var legend=marks.map(function(mk,i){
    var bn=markName[mk]||(blindMarkMap[mk]&&blindMarkMap[mk].label)||mk;
    return '<div class="bleg-row">'+_biNums[i]+' '+(revealed?biMarkChip(mk)+' ':'')+'<span>'+esc(bn)+'</span></div>';
  }).join('');
  // 操作エリア（自分用）
  var action='';
  if(!s.inputOpen){
    action='<div style="margin-top:12px;font-size:13px;color:#a37b16;text-align:center">入力は締め切られました</div>';
  }else if(me&&me.confirmed){
    action='<div style="margin-top:12px"><div style="font-size:12px;color:#1a6640;font-weight:700;margin-bottom:6px">✅ あなたの回答は確定済みです</div>'
      +'<button onclick="biUnconfirm()" style="width:100%;padding:10px;border:1px solid #ccc;background:#f5f5f5;border-radius:8px;font-size:14px;cursor:pointer">確定を解除して修正</button></div>';
  }else{
    action='<div style="margin-top:12px"><div style="font-size:12px;color:#666;margin-bottom:6px">各グラス（①〜）がどのお酒か選んでください。選択は自動で共有・保存されます。</div>'
      +'<button onclick="biConfirm()" style="width:100%;padding:11px;border:none;background:#0c447c;color:#fff;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">確定する</button></div>';
  }
  var title=document.getElementById('bi-title'); if(title) title.textContent=revealed?'🎭 ブラインド結果（公開中）':'🎭 ブラインド結果入力';
  document.getElementById('bi-body').innerHTML=
    '<div class="bt-wrap"><table class="bt">'+thead+'<tbody>'+tbody+'</tbody></table></div>'
    +'<div class="bleg"><div style="font-size:11px;color:#8a7a60;font-weight:600;margin-bottom:4px">マーク対応</div>'+legend+'</div>'
    +action;
}
function biSetAnswer(mk,val){ var me=_biMe(); if(!me) return; me.answers[mk]=val||null; renderBiTable(); biPersist(); }
function biSetWinner(val){ var me=_biMe(); if(!me) return; me.winner=val||null; renderBiTable(); biPersist(); }
// ── カラーマークピッカー（管理者画面と同じ体裁） ──
var _biPanel=null;
function _biClosePanel(){ if(_biPanel){ try{_biPanel.remove();}catch(e){} _biPanel=null; } }
function _biOptRows(cur){
  var s=_biState; if(!s) return '';
  return s.marks.map(function(mk,i){
    var lbl=(blindMarkMap[mk]&&blindMarkMap[mk].label)||mk;
    return '<div class="bi-pkopt'+(cur===mk?' active':'')+'" data-mk="'+esc(mk)+'">'
      +'<span class="n">'+_biNums[i]+'</span><span class="sy">'+biMarkChip(mk)+'</span><span class="l">'+esc(lbl)+'</span></div>';
  }).join('');
}
function _biOpenPanel(html,btnEl,onPick){
  if(_biPanel){ _biClosePanel(); return; }   // 同じボタン再タップで閉じる（トグル）
  var panel=document.createElement('div');
  panel.className='bi-pkpanel';
  panel.innerHTML='<div class="bi-pkopt bi-pknone" data-mk="">− クリア</div>'+html;
  panel.addEventListener('click',function(e){
    e.stopPropagation();
    var opt=e.target.closest('.bi-pkopt'); if(!opt) return;
    _biClosePanel(); onPick(opt.getAttribute('data-mk')||'');
  });
  panel.style.visibility='hidden';
  document.body.appendChild(panel);
  _biPanel=panel;
  requestAnimationFrame(function(){
    var rect=btnEl.getBoundingClientRect();
    var ph=panel.offsetHeight, spaceBelow=window.innerHeight-rect.bottom-8;
    panel.style.top=((spaceBelow<ph&&rect.top>ph)?rect.top-ph-4:rect.bottom+4)+'px';
    panel.style.left=Math.max(4,Math.min(rect.left,window.innerWidth-panel.offsetWidth-4))+'px';
    panel.style.visibility='visible';
  });
}
function biOpenPicker(ev,colMk,btnEl){
  ev.stopPropagation();
  var me=_biMe(); if(!me) return;
  _biOpenPanel(_biOptRows(me.answers[colMk]||''), btnEl, function(val){ biSetAnswer(colMk,val); });
}
function biOpenWinnerPicker(ev,btnEl){
  ev.stopPropagation();
  var me=_biMe(); if(!me) return;
  _biOpenPanel(_biOptRows(me.winner||''), btnEl, function(val){ biSetWinner(val); });
}
function biConfirm(){
  var s=_biState, me=_biMe(); if(!me) return;
  var unfilled=s.marks.some(function(mk){ return !me.answers[mk]; });
  if(unfilled && !window.confirm('未選択の項目がありますが確定しますか？')) return;
  me.confirmed=true; renderBiTable(); biPersist(); mpToast('確定しました');
}
function biUnconfirm(){ var me=_biMe(); if(!me) return; me.confirmed=false; renderBiTable(); biPersist(); mpToast('確定を解除しました'); }
function biPersist(){
  var s=_biState, me=_biMe(); if(!s||!me) return;
  var answers=s.marks.map(function(mk){ return {blindMarkId:mk, guessMarkId:me.answers[mk]||null}; });
  var data={ id:s.batchId+'__'+s.myCustomerId, batchId:s.batchId, groupId:s.repGid, visitKey:s.visitId,
    customerId:s.myCustomerId, authUid:s.authUid,
    name:(currentMember&&(currentMember.nickname||currentMember.name))||s.myCustomerId,
    answers:answers, winner:me.winner||null, confirmed:!!me.confirmed,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp() };
  if(me.confirmed) data.confirmedAt=firebase.firestore.FieldValue.serverTimestamp();
  db.collection('blindGuesses').doc(data.id).set(data,{merge:true}).catch(function(e){ mpToast('保存失敗: '+(e.message||e)); });
}

async function loadVisitStatus(memberId){
  var el=document.getElementById('visit-status-bar');
  if(!el||!memberId)return;
  try{
    var act=await fetchActivity(memberId);
    var vs=(act.visits||[]).slice();
    var active=vs.find(v=>!v.checkoutTime);
    if(active){
      var t=active.visitTime||'';
      var tStr=t.length>=4?t.slice(0,2)+':'+t.slice(2,4):'';
      el.innerHTML='<div class="vstatus vstatus-active">🏮 来場中'+(tStr?' '+tStr+'～':'')+'</div>';
      return;
    }
    if(!vs.length){
      el.innerHTML='<div class="vstatus vstatus-none">まだ来場記録がありません</div>';
      return;
    }
    vs.sort((a,b)=>(b.visitDate||'').localeCompare(a.visitDate||''));
    var last=vs[0];
    var vd=last.visitDate||'';
    if(vd.length>=6){
      var y=2000+parseInt(vd.slice(0,2),10),m=parseInt(vd.slice(2,4),10),d=parseInt(vd.slice(4,6),10);
      var vDate=new Date(y,m-1,d);
      var today=new Date();today.setHours(0,0,0,0);
      var daysAgo=Math.round((today-vDate)/(864e5));
      var mmdd=m+'/'+d;
      var dStr=daysAgo===0?'本日':(daysAgo+'日前');
      el.innerHTML='<div class="vstatus vstatus-last">📅 最終来場 '+dStr+' ('+mmdd+')</div>';
    }
  }catch(e){console.warn('loadVisitStatus:',e);}
}

function closeBlindModal(){
  document.getElementById('blind-modal').classList.remove('open');
}
document.getElementById('blind-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('blind-modal'))closeBlindModal();
});
